<meta name="twitter:card" content="summary">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#22c55e">
<script>
// Tema antes do primeiro desenho, para não piscar em claro: a escolha feita
// no botão (aqui ou no assistente) nesta sessão, senão o tema do sistema (e
// segue-o se mudar).
(function () {
  var mq = window.matchMedia && matchMedia('(prefers-color-scheme: dark)');
  function apply() {
    var t = null;
    try { t = sessionStorage.getItem('ceme:theme'); } catch (e) {}
    document.documentElement.dataset.theme = t === 'dark' || t === 'light' ? t : (mq && mq.matches ? 'dark' : 'light');
  }
  apply();
  if (mq && mq.addEventListener) mq.addEventListener('change', apply);
})();
</script>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="CEME">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="icon" href="/icon-192.png">
<style>
  :root{color-scheme:light;
    --ink:#0f172a;--mut:#64748b;--line:#e2e8f0;--bg:#f1f5f9;
    --acc:#22c55e;--accD:#15803d;--gold:#f59e0b;--rose:#ef4444;
    --card:#ffffff;--soft:#f8fafc;
    /* superfícies e realces que mudam com o tema */
    --field:#fff;--seg:#e9eef3;--track:#edf0f3;--hi:#f0fdf4;--th:#f8fafc;
    --link:#166534;--yes:#15803d;--no:#b91c1c;--star:#cbd5e1;
    --cIdx:#1d4ed8;--cIdxOff:#93c5fd;--cFix:#16a34a;--cFixOff:#86efac;--cWarn:#b45309;--grid:#eef2f5;
  }
  /* Tema escuro: segue o sistema (prefers-color-scheme), ou a escolha feita no
     botão de tema nesta sessão (sessionStorage `ceme:theme`, partilhada com o
     assistente). Quem decide é o
     script no <head>, que põe data-theme no <html>. A header e o hero já são
     escuros nos dois temas. */
  :root[data-theme="dark"]{color-scheme:dark;
    --ink:#e2e8f0;--mut:#94a3b8;--line:#253147;--bg:#0b1120;
    --accD:#4ade80;--card:#131c2e;--soft:#1b2639;
    --field:#0f1729;--seg:#0b1120;--track:#253147;--hi:#12271f;--th:#18223a;
    --link:#4ade80;--yes:#4ade80;--no:#f87171;--star:#475569;
    --cIdx:#60a5fa;--cIdxOff:#2563eb;--cFix:#4ade80;--cFixOff:#16a34a;--cWarn:#fbbf24;--grid:#253147;
  }
  :root[data-theme="dark"] .badge{background:#1f2a3e;color:#cbd5e1}
  :root[data-theme="dark"] .idx{background:#172554;color:#93c5fd}
  :root[data-theme="dark"] .grn,:root[data-theme="dark"] .tag-aplicado{background:#14321f;color:#86efac}
  :root[data-theme="dark"] .bnd,:root[data-theme="dark"] .est{background:#3b2a0a;color:#fcd34d}
  :root[data-theme="dark"] .ac{background:#2e1f5e;color:#c4b5fd}
  :root[data-theme="dark"] .note-ac{background:#1e1838;border-left-color:#8b5cf6}
  :root[data-theme="dark"] .wr{background:#3f1515;color:#fca5a5}
  :root[data-theme="dark"] table.q tr.win-idx{background:#132040}
  :root[data-theme="dark"] table.q tr.win-idx td.w{color:#93c5fd}
  :root[data-theme="dark"] table.q tr.win-fix{background:#1b2230}
  :root[data-theme="dark"] table.q tr.win-fix td.w{color:#a1a1aa}
  :root[data-theme="dark"] .scope .warn{background:#2a2108;border-color:#713f12}
  :root[data-theme="dark"] .mg .mi.fav{background:#2a2508}
  :root[data-theme="dark"] footer a{color:#93c5fd}
  :root[data-theme="dark"] .seg button.on{box-shadow:0 2px 8px rgba(0,0,0,.4)}
  :root[data-theme="dark"] .card,:root[data-theme="dark"] .favside .fs-card{box-shadow:0 4px 20px rgba(0,0,0,.25)}
  *{box-sizing:border-box;margin:0}
  html,body{height:100%}
  body{font-family:"Inter","Segoe UI",system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
  button{font-family:inherit}

  /* ---------- header ---------- */
  header.top{position:sticky;top:0;z-index:30;background:rgba(15,23,42,.92);backdrop-filter:blur(10px);color:#fff;border-bottom:1px solid rgba(255,255,255,.08)}
  /* A header é mais larga do que o conteúdo: com cinco links na nav (e o
     logo completo, que não se pode truncar) 820 px já não chegam. */
  header .wrap{max-width:1080px;margin:0 auto;padding:11px 16px;display:flex;gap:10px;align-items:center}
  /* Abaixo desta largura já não há espaço para o sufixo do logo («@ O Carro
     Elétrico»): fica o nome, sem cortar o texto a meio. */
  @media (max-width:1059px){ .logo .lg2{display:none} }
  .logo{font-weight:800;font-size:19px;text-decoration:none;color:#fff;display:flex;align-items:center;gap:6px;min-width:0;flex:1 1 auto}
  .logo .ttl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .logo .mark{background:linear-gradient(135deg,#4ade80,#22c55e);color:#052e16;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-size:15px;box-shadow:0 2px 8px rgba(34,197,94,.4)}
  nav{display:flex;gap:4px;margin-left:10px;flex:0 0 auto}
  nav a{color:#94a3b8;text-decoration:none;font-size:13.5px;font-weight:600;padding:7px 11px;border-radius:999px;transition:.15s;white-space:nowrap}
  nav a:hover{color:#fff;background:rgba(255,255,255,.08)}
  /* selector de lingua: tem de anular o chrome global dos botoes (radius 11px,
     padding 9/15) senao a bandeira fica numa caixa enorme. */
  .langs{display:flex;gap:6px;margin-left:10px;flex:0 0 auto;align-items:center}
  .langs button{padding:0;border:0;background:none;box-shadow:none;border-radius:3px;cursor:pointer;line-height:0;font-size:0;opacity:.45;transition:opacity .15s}
  .langs button svg{display:block;border-radius:2px;
    box-shadow:0 0 0 1px rgba(255,255,255,.28);transition:box-shadow .15s}
  /* altura igual, largura pela razao oficial de cada bandeira (PT 7:4, GB 2:1) */
  .langs button svg{height:15px}
  .langs button[data-lang="pt"] svg{width:26.25px}
  .langs button[data-lang="en"] svg{width:30px}
  .langs button:hover{opacity:.9;background:none}
  .langs button.on{opacity:1;background:none;color:inherit;border:0}
  .langs button.on svg{box-shadow:0 0 0 1.5px #fff}
  nav a.on{background:#22c55e;color:#052e16;font-weight:800}
  /* botão de tema: na header, que é escura nos dois temas */
  .themebtn{flex:0 0 auto;width:32px;height:32px;padding:0;margin-left:4px;border:0;border-radius:8px;background:none;color:#cbd5e1;display:grid;place-items:center}
  .themebtn:hover{background:rgba(255,255,255,.08);color:#fff}
  .themebtn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

  /* ---------- hero ---------- */
  .hero{position:relative;overflow:hidden;background:radial-gradient(1200px 400px at 15% -10%,#1f6f3a 0%,transparent 60%),radial-gradient(900px 300px at 95% 10%,#1e3a8a 0%,transparent 55%),linear-gradient(135deg,#052e16 0%,#0b3b20 45%,#0c2a4a 100%);color:#fff}
  .hero .in{max-width:820px;margin:0 auto;padding:30px 16px 24px}
  .hero h1{margin:0;font-size:30px;line-height:1.1;letter-spacing:-.6px}
  .hero h1 span{background:linear-gradient(90deg,#4ade80,#86efac);-webkit-background-clip:text;background-clip:text;color:transparent}
  .hero p{margin:8px 0 0;color:#a7f3d0;font-size:14px}
  .hero p.scope-hint{font-size:12.5px;margin-top:9px;padding:7px 11px;background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.24);border-radius:10px;color:#e8f5ec;display:inline-block;line-height:1.5}
  .hero p.scope-hint u{text-decoration-color:#fbbf24;text-underline-offset:2px}
  .live{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
  .pill{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:7px 13px;font-size:13px;display:flex;align-items:center;gap:6px}
  .pill b{color:#4ade80}
  .livedot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#4ade80;box-shadow:0 0 0 3px rgba(74,222,128,.2);animation:pl 2s infinite}
  @keyframes pl{50%{opacity:.3}}

  main{max-width:820px;margin:0 auto;padding:14px 14px 70px}

  /* ---------- cards ---------- */
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px;margin:12px 0;box-shadow:0 4px 20px rgba(15,23,42,.05);transition:box-shadow .15s}
  .card:hover{box-shadow:0 6px 24px rgba(15,23,42,.08)}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .grow{flex:1}
  label.fl{display:flex;flex-direction:column;font-size:11px;color:var(--mut);gap:5px;font-weight:600}
  input,select{padding:10px 12px;border-radius:11px;border:1px solid var(--line);font-size:14px;background:var(--field);color:var(--ink);transition:border .15s,box-shadow .15s}
  input:focus,select:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px rgba(34,197,94,.18)}
  input[type=range]{padding:0;accent-color:var(--acc);cursor:pointer}
  button{border-radius:11px;border:1px solid var(--line);padding:9px 15px;background:var(--field);font-size:14px;cursor:pointer;color:var(--ink);font-weight:600;transition:.15s}
  button:hover{background:var(--soft)}
  button.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
  .seg{display:flex;background:var(--seg);border-radius:13px;padding:4px;gap:3px}
  .seg button{border:none;background:none;flex:1;padding:9px 6px;border-radius:10px;line-height:1.25;font-weight:600;color:var(--mut)}
  .seg button small{display:block;font-size:10px;font-weight:500}
  .seg button.on{background:var(--card);color:var(--ink);box-shadow:0 2px 8px rgba(15,23,42,.12)}
  small{color:var(--mut)}
  .sec{font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:1.2px;color:var(--mut);margin:20px 2px 6px}
  /* ---------- ranking ---------- */
  .tcard{position:relative;overflow:hidden;border-left:none;padding:16px 16px 14px 18px}
  .tcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--brand,#666)}
  .tcard.first{border:2px solid var(--acc);background:linear-gradient(180deg,var(--hi) 0%,var(--card) 40%)}
  .rank{font-size:12px;font-weight:800;color:#fff;background:#94a3b8;border-radius:9px;min-width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;margin-right:8px}
  .tcard.first .rank{background:var(--acc);box-shadow:0 2px 8px rgba(34,197,94,.5)}
  .ribbon{display:inline-block;font-size:11px;font-weight:800;color:#fff;background:linear-gradient(135deg,#22c55e,#16a34a);border-radius:7px;padding:3px 9px;margin-left:8px;vertical-align:middle;box-shadow:0 2px 6px rgba(34,197,94,.4)}
  .total{font-size:26px;font-weight:800;letter-spacing:-.6px}
  .per{font-size:13px;color:var(--mut);font-weight:500}
  .tname{font-size:14.5px;margin-top:3px}
  .badge{display:inline-block;font-size:11px;font-weight:700;border-radius:999px;padding:3px 9px;background:#eef2f5;color:#3f4750;margin:4px 4px 0 0;white-space:nowrap}
  .idx{background:#dbeafe;color:#1d4ed8}.grn{background:#dcfce7;color:#15803d}.bnd{background:#fef3c7;color:#92400e}
.ac{background:#ede9fe;color:#5b21b6}
.note-ac{margin:.5em 0 0;padding:.5em .7em;border-left:3px solid #7c3aed;background:#f5f3ff;border-radius:0 6px 6px 0;font-size:.85em;line-height:1.45}
  .wr{background:#fee2e2;color:#b91c1c}.est{color:#a16207;background:#fef9c3}
  .bar{height:8px;border-radius:99px;background:var(--track);margin-top:10px;overflow:hidden}
  /* a cor segue o preço: verde (barato) -> vermelho (caro). O comprimento
     continua linear/proporcional; a cor é que carrega o "quente". */
  .bar>i{display:block;height:100%;border-radius:99px;box-shadow:inset 0 1px 0 rgba(255,255,255,.4);
    transition:background .2s}
  .favbtn{border:none;font-size:22px;padding:2px 8px;background:none;color:var(--star)}
  .favbtn.f{color:#f59e0b}
  details{font-size:13px;margin-top:10px}
  summary{cursor:pointer;color:var(--mut);font-weight:600;padding:4px 0}
  details table{border-collapse:collapse;width:100%;margin-top:8px}
  details td,details th{border-bottom:1px solid var(--line);padding:6px 2px;text-align:right;font-variant-numeric:tabular-nums}
  details td:first-child,details th:first-child{text-align:left}
  details tr.aplicado{background:var(--hi)}
  details tr.aplicado td:first-child{box-shadow:inset 3px 0 0 #16a34a}
  details tr.sub td{font-size:12px;color:var(--mut)}
  details table.cost td:last-child{text-align:right;white-space:nowrap}
  .tag-aplicado{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:#166534;background:#dcfce7;border-radius:999px;padding:2px 7px;white-space:nowrap}
  a.src{font-size:12px;color:var(--link);font-weight:600}
  .kpi{display:flex;gap:10px;flex-wrap:wrap}
  .kpi>div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 14px;flex:1;min-width:150px;box-shadow:0 2px 8px rgba(15,23,42,.04)}
  .kpi b{font-size:20px}
  svg.chart{width:100%;height:auto;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 2px 8px rgba(15,23,42,.04)}
  .legend{font-size:12px;color:var(--mut);margin-top:6px}
  .qwrap{max-height:640px;overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--card)}
  table.q td.p-idx{font-weight:600}
  table.q td.w{font-size:11px;text-transform:uppercase;letter-spacing:.03em}
  table.q tr.win-idx{background:#eef6ff}
  table.q tr.win-idx td.w{color:#1d4ed8;font-weight:700}
  table.q tr.win-fix{background:#f4f4f5}
  table.q tr.win-fix td.w{color:#71717a;font-weight:700}
  table.q tr.win-idx.cheap td:first-child,table.q tr.win-fix.cheap td:first-child{box-shadow:inset 3px 0 0 #d97706}
  table.q{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
  table.q td,table.q th{border-bottom:1px solid var(--line);padding:6px 5px;text-align:right}
  table.q td:first-child,table.q th:first-child{text-align:left;white-space:nowrap}
  table.q tr.cheap td{background:var(--hi);font-weight:700}
  table.q th{background:var(--th);position:sticky;top:0;font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--mut)}
  footer{max-width:820px;margin:0 auto;padding:0 16px 40px;font-size:12px;color:var(--mut)}
  .scope{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--acc);border-radius:14px;padding:13px 15px;margin-bottom:14px;box-shadow:0 2px 8px rgba(15,23,42,.04)}
  .scope h3{margin:0 0 6px;font-size:14px;font-weight:800;display:flex;align-items:center;gap:8px;cursor:pointer}
  .scope h3 .caret{font-size:11px;color:var(--mut);transition:transform .15s}
  .scope.closed h3 .caret{transform:rotate(-90deg)}
  .scope.closed>div{display:none}
  .scope h3:hover{color:var(--accD)}
  .scope .hint{font-size:12.5px;color:var(--mut);margin:0 0 8px;line-height:1.5}
  .scope table{border-collapse:collapse;width:100%;font-size:12.5px;margin:8px 0}
  .scope td{border-bottom:1px solid var(--line);padding:6px 4px;vertical-align:top}
  .scope td:last-child{text-align:right;white-space:nowrap;font-weight:700}
  .scope .yes{color:var(--yes)}
  .scope .no{color:var(--no)}
  .scope .warn{background:#fffbeb;border:1px solid #fde68a;border-radius:10px;padding:9px 11px;font-size:12.5px;line-height:1.5;margin:8px 0 0}
  .scope a{color:var(--link);font-weight:600}
  .scope .more{margin-top:9px;font-size:12.5px;display:flex;gap:14px;flex-wrap:wrap}
  .empty{padding:26px;text-align:center;color:var(--mut)}
  .modal{position:fixed;inset:0;background:rgba(15,23,42,.5);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
  .modal.on{display:flex}
  .modal .mbox{background:var(--card);border-radius:18px;max-width:720px;width:100%;max-height:85vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.25)}
  .modal .mhead{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
  .modal .mbody{padding:14px 16px;overflow:auto;flex:1}
  .modal .mfoot{padding:10px 16px;border-top:1px solid var(--line);font-size:12px;color:var(--mut)}
  .mg{margin-bottom:12px}
  .mg h4{font-size:13px;font-weight:700;margin:8px 0 4px;display:flex;align-items:center;gap:6px}
  .mg .mi{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 8px;border-radius:8px;cursor:pointer;font-size:13px}
  .mg .mi:hover{background:var(--soft)}
  .mg .mi .nm{flex:1;min-width:0}
  .mg .mi .meta{font-size:11px;color:var(--mut)}
  .mg .mi.fav{background:#fef9c3}
  .favside{max-width:820px;margin:0 auto 40px;padding:0 14px}
  .favside .fs-card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:0 4px 20px rgba(15,23,42,.05)}
  .favside h3{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:1px;color:var(--mut);margin:0 0 8px}
  .favside .fs-group{margin-bottom:10px}
  .favside .fs-group h4{font-size:12px;font-weight:700;margin:6px 0 4px;display:flex;align-items:center;gap:6px}
  .favside .fs-item{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:12.5px}
  .favside .fs-item:last-child{border-bottom:none}
  .favside .fs-item .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .favside .fs-item .pr{font-weight:700;color:var(--accD);white-space:nowrap}
  .favside .fs-item button{border:none;background:none;cursor:pointer;color:var(--star);font-size:16px;padding:0 2px}
  .favside .fs-item button:hover{color:#ef4444}
  .favside .empty{font-size:12px;color:var(--mut);text-align:center;padding:14px}
  @media (min-width: 980px) {
    aside.favside{position:fixed;right:20px;top:70px;width:280px;max-height:calc(100vh - 80px);overflow:auto;margin:0;padding:0}
  }
  @media (max-width: 520px) {
    .hero .in{padding:22px 14px 18px}
    .hero h1{font-size:24px}
    main{padding:10px 10px 60px}
    .card{padding:12px;border-radius:14px}
    .total{font-size:22px}
    .tname{font-size:13px}
    .rank{min-width:24px;height:24px;font-size:11px}
    .badge{font-size:10px;padding:2px 7px}
    .seg button{font-size:12px;padding:7px 4px}
    .seg button small{font-size:9px}
    input,select{font-size:13px;padding:9px 10px}
    button{font-size:13px;padding:8px 12px}
    nav a{font-size:12px;padding:5px 10px}
    .logo{font-size:14px;gap:5px;flex:1 1 auto}
    .logo .mark{width:22px;height:22px;font-size:12px;flex:0 0 auto}
    .langs{margin-left:auto}
    /* Em duas linhas: o logo e as bandeiras em cima, a nav por baixo. Com
       cinco links não cabia tudo numa linha, e espremer os rótulos ficava
       ilegível — a nav desliza na horizontal, em vez disso. */
    header .wrap{flex-wrap:wrap;row-gap:4px;padding:8px 12px}
    nav{order:3;flex:1 0 100%;max-width:100%;margin-left:0;gap:4px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
    nav::-webkit-scrollbar{display:none}
    nav #nHome{display:none}
    table.q{font-size:12px}
    table.q td,table.q th{padding:4px 3px}
    .kpi>div{min-width:100%}
    .qwrap{max-height:460px}
    .bigkwh{font-size:26px}
  }

/* O simulador completo. Tudo vive neste ficheiro: CSS em cima, HTML mínimo

const STR = CEME_STR('simulador');
const REG_DATA = CEME_I18N.regions;

const NAME_RULES = [

  ['não sócio', 'non-member'],
  ['sócio', 'member'],
  ['desconto', 'discount'],

// Nomes que não devem ser mexidos, mesmo se contiverem uma das frases acima.
const NAME_KEEP = /^(myAtlante|Eco Green|VECARD|GOW|Hyundai Blue|AB Energia|Go\.Charge by EVIO)/;

function tariffName(name, lang) {
  if ((lang || L) !== 'en' || !name || NAME_KEEP.test(name)) return name;
  let out = name;
  for (const [pt, en] of NAME_RULES) out = out.split(pt).join(en);

}
// A pesquisa não deve depender da língua da interface: quem escreve "indexed"
// em PT tem de encontrar o tarifário, e quem escreve "indexado" em inglês
// também. Por isso compara sempre contra as duas formas.
// Também ignora acentos, senão "luzigas" não encontra "LUZiGÁS".
const deaccent = (s) => String(s).normalize('NFD').replace(/[\u0300-\u036f]/g, '');
const searchText = (tf) => deaccent(`${tf.ceme} ${tf.name} ${tariffName(tf.name)} ${tariffName(tf.name, 'en')}`);

let L = 'pt';
function i18n(k, vars) {
  let s = (STR[L] && STR[L][k]) ?? STR.pt[k] ?? k;
  if (vars) for (const v in vars) s = s.split('{' + v + '}').join(vars[v]);
  return s;
}
const REG = () => Object.fromEntries(Object.entries(REG_DATA).map(([k, v]) => [k, v[L]]));
const R = () => REG_DATA[S.region][L];
// As horas mostradas são as do relógio da região do carregamento (é nele que
// se lêem os períodos), no formato ISO aaaa/mm/dd hh:mm (24h).
const regionTz = () => CEME_TZ.TZ[S.region] || CEME_TZ.TZ.CONT;
const locDate = iso => CEME_TZ.toWall(new Date(iso), regionTz());
const fmtNum = n => L === 'en' ? String(n) : String(n).replace('.', ',');

function setLang(l, persist = true) {

}
// Tema: o <head> já o aplicou; o botão troca-o e guarda a escolha só nesta
// sessão, como no assistente (mesma chave, por isso as duas páginas
// concordam).
const SUN = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4"/></svg>';
const MOON = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>';
const isDark = () => document.documentElement.dataset.theme === 'dark';
function paintThemeBtn() {

function initialLang() {

  return (typeof window.__LANG__ === 'string' && window.__LANG__ === 'en') ? 'en' : 'pt';
}
// Partes estáticas do chrome (fora dos views renderizados por JS)
function applyChrome() {

  const ph = (id, v) => { const el = document.getElementById(id); if (el) el.placeholder = v; };

  set('nSobre', i18n('navSobre')); set('nContactos', i18n('navContactos'));
  set('fmTitle', i18n('fmTitle')); set('fmFoot', i18n('fmFoot'));
  ph('favSearch', i18n('fmPh'));
  const f = document.querySelector('footer');
  if (f) f.innerHTML = i18n('footScope') + ' <a href="https://www.mobie.pt/custo-do-carregamento" target="_blank" rel="noopener">' + (L === 'en' ? 'Official breakdown ↗' : 'Ver a estrutura oficial ↗') + '</a> · <a href="https://www.mobie.pt/pt/carregarveiculo/faq" target="_blank" rel="noopener">FAQ Mobi.E ↗</a><br><br>' + i18n('footRest') +
    '<br><br><a href="/sobre">' + i18n('navSobre') + '</a> · <a href="/contactos">' + i18n('navContactos') + '</a> · <a href="/privacidade">' + i18n('navPriv') + '</a> · <a href="https://github.com/CarregaErvilhas/CEME/issues" target="_blank" rel="noopener">GitHub Issues ↗</a>';
}

/* ================= estado ================= */
const API = location.origin;
let token = sessionStorage.getItem('ceme:jwt');
let LAST = [], AVG = null, AT = null, OMIE = 0.20;
const favs = () => {
  // localStorage pode ter lixo (dados antigos, edição à mão): se não ler,
  // começa vazio.
  try { const v = JSON.parse(localStorage.getItem('ceme:favs') || '[]'); return Array.isArray(v) ? v.filter(x => typeof x === 'string') : []; } catch (e) { return []; }
};
function loadS() {
  // Lê o estado guardado e valida cada campo aqui, à entrada: números passam
  // a número, valores desconhecidos voltam ao defeito. Assim o resto do
  // código pode confiar em `S`. (O esc() nos templates é a segunda defesa
  // contra HTML injectado.)
  try {
    const r = localStorage.getItem('ceme:S');
    if (!r) return;
    const o = JSON.parse(r);
    if (!o || typeof o !== 'object' || Array.isArray(o)) return;
    const num = (v, d) => (typeof v === 'number' && Number.isFinite(v)) ? v : (Number.isFinite(Number(v)) ? Number(v) : d);
    const str = (v, d, allowed) => (typeof v === 'string' && (!allowed || allowed.includes(v))) ? v : d;
    const bool = (v, d) => (typeof v === 'boolean') ? v : d;
    S.kwh = num(o.kwh, S.kwh);
    S.omie = num(o.omie, S.omie);
    S.omieVazio = num(o.omieVazio, S.omieVazio);
    S.omieFora = num(o.omieFora, S.omieFora);
    S.batCap = num(o.batCap, S.batCap);
    S.batMin = num(o.batMin, S.batMin);
    S.batMax = num(o.batMax, S.batMax);
    S.region = str(o.region, S.region, ['CONT', 'MAD', 'AZO']);
    S.ramal = str(o.ramal, S.ramal, ['BT', 'MT']);
    S.energyMode = str(o.energyMode, S.energyMode, ['kwh', 'bat']);
    S.volt = str(o.volt, S.volt);
    S.q = str(o.q, S.q);
    S.idx = str(o.idx, S.idx);
    S.fix = str(o.fix, S.fix);
    S.scopeClosed = bool(o.scopeClosed, S.scopeClosed);
    S.green = bool(o.green, S.green);
    S.nobundle = bool(o.nobundle, S.nobundle);
    S.popular = bool(o.popular, S.popular);
    S.favonly = bool(o.favonly, S.favonly);
    S.omieAuto = bool(o.omieAuto, S.omieAuto);
    if (typeof o.chargeAt === 'string') S.chargeAt = o.chargeAt;
    if (typeof o.serverNow === 'string') S.serverNow = o.serverNow;
    if (typeof o.forceServerTime === 'boolean') S.forceServerTime = o.forceServerTime;
  } catch (e) {}
}
function saveS() { try { localStorage.setItem('ceme:S', JSON.stringify(S)); } catch (e) {} }
const S = { kwh: 40, region: 'CONT', scopeClosed: false, omie: 0.20, omieAuto: true, omieVazio: 0.20, omieFora: 0.20, volt: '', ramal: 'BT', green: false, nobundle: false, popular: false, favonly: false, q: '', idx: 'luzigas-casa-mt', fix: 'atlante-mt',
  energyMode: 'kwh', batCap: 60, batMin: 20, batMax: 80,
  chargeAt: null, forceServerTime: false, serverNow: null };

async function sess() {
  if (token) return token;
  const r = await fetch(API + '/v1/session', { method: 'POST' });
  if (!r.ok) throw new Error('sessão indisponível (erro ' + r.status + ')');
  const tk = (await r.json()).token;
  if (!tk) throw new Error('sessão sem token');
  token = tk;
  try { sessionStorage.setItem('ceme:jwt', token); } catch (e) {} // modo privado pode recusar
  return token;
}
// O fuso do browser: a hora de relógio que se mostra ao utilizador é a
// dele. O backend guarda tudo em UTC e só converte aqui, na apresentação.
const BROWSER_TZ = (() => {
  try { return Intl.DateTimeFormat().resolvedOptions().timeZone || 'UTC'; } catch (e) { return 'UTC'; }
})();
async function api(path, opts = {}) {
  let tk = await sess();
  let r = await fetch(API + path, { ...opts, headers: { ...(opts.headers || {}), Authorization: 'Bearer ' + tk } });
  // O token expira ao fim de 24 h. Num 401, pede um token novo e repete o
  // pedido uma vez.
  if (r.status === 401) {
    token = null;
    try { sessionStorage.removeItem('ceme:jwt'); } catch (e) {}
    tk = await sess();
    r = await fetch(API + path, { ...opts, headers: { ...(opts.headers || {}), Authorization: 'Bearer ' + tk } });
  }
  // Qualquer outro erro HTTP vira uma excepção com a mensagem do servidor,
  // para não ser confundido com uma lista vazia.
  if (!r.ok) { const j = await r.json().catch(() => ({})); throw new Error(j?.error?.message || ('erro ' + r.status)); }
  return r.json();
}
// Escapa texto antes de o meter no HTML (evita que alguém injecte HTML ou
// scripts, o chamado XSS). Usa-o sempre que mostrares texto vindo do
// utilizador ou da API.
const esc = (s) => String(s == null ? '' : s)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
  .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
const eur = n => Number(n).toFixed(2) + '€';
const kwhe = n => Number(n).toFixed(3) + '€/kWh';
const cycName = c => (c === 'SIMPLES' ? i18n('cycSimple') : i18n(c === 'DIARIO' ? 'cycDaily' : 'cycWeekly'));
const perName = p => ({ VAZIO: i18n('pVazio'), FORA_VAZIO: i18n('pFora'), UNICO: i18n('pUnico') }[p] || p);
const effKwh = () => S.energyMode === 'bat' ? Math.max(0.1, S.batCap * Math.max(0, S.batMax - S.batMin) / 100) : S.kwh;
// A energia só aparece impressa com uma casa (56,8 kWh). O valor bruto vai
// para os cálculos — nunca para o ecrã.
const kwhTxt = () => fmtNum(effKwh().toFixed(1));
// A hora do carregamento escreve-se e lê-se no relógio da REGIÃO, não no do
// browser (vê frontend/tz.js): quem simula os Açores a partir de Lisboa está
// a falar das horas dos Açores.
// "neste momento" só quando se simula agora; com hora fixa diz-se qual (no
// relógio da região, a partir do instante que o servidor usou).
function perWhen() {
  return S.chargeAt && AT ? i18n('atTimeIn', { t: toIsoDisplay(AT) }) : `<span class="livedot"></span>${i18n('rightNowIn')}`;
}
function toIsoDisplay(iso) {
  return CEME_TZ.toWall(iso ? new Date(iso) : new Date(), regionTz());
}
function fromIsoDisplay(v) {
  const at = CEME_TZ.fromWall(v, regionTz());
  return at ? at.toISOString() : null;
}

/* ================= SIMULAR ================= */
// As notas dos tarifários chegam como CÓDIGO (ex.: AC_DC_FLAT) e traduzem-se
// aqui. Um código desconhecido mostra-se tal e qual.
const NOTE_KEY = { AC_DC_FLAT: 'noteACDC' };
function noteText(code) { return i18n(NOTE_KEY[code] || code); }

function badges(q) {
  let b = `<span class="badge">${q.schedule === 'SIMPLES' ? i18n('simple') : i18n('biHourly', { c: cycName(q.cycle) })}</span>`;
  b += `<span class="badge ${q.kind === 'INDEXED' ? 'idx' : ''}">${q.kind === 'INDEXED' ? i18n('idxOmie') : i18n('fixedPrice')}</span>`;
  if (q.kind === 'INDEXED') b += `<span class="badge idx">K = ${fmtNum(q.k)}</span>`;
  if (q.green) b += `<span class="badge grn">${i18n('green')}</span>`;
  if (q.popular) b += `<span class="badge">${i18n('tagPopular')}</span>`;
  if (q.bundle) b += `<span class="badge bnd" title="${i18n('bundleTip')}">${i18n('needsHome')}</span>`;
  if (q.notes) b += `<span class="badge ac" title="${noteText(q.notes)}">${i18n('acOnly')}</span>`;
  // activation_stale: o CEME ainda publica a taxa de activação legal do ano
  // anterior. Mostra-se um aviso, mas a conta usa o valor publicado.
  if (q.activation_stale) b += `<span class="badge wr" title="${i18n('egmeStaleTip', { act: fmtNum(q.activation), legal: fmtNum(q.egme_legal) })}">${i18n('egmeStale')}</span>`;
  if (q.warning) b += `<span class="badge wr">${i18n(q.warning === 'OMIE_CONT_REF' ? 'warnOmieCont' : q.warning)}</span>`;
  if (!((',' + (q.avail || 'CONT') + ',').includes(',' + S.region + ','))) b += `<span class="badge">${i18n('soldIn', { r: esc(q.avail) })}</span>`;
  if (q.estimated) b += `<span class="badge est" title="${i18n('estTip')}">~</span>`;
  return b;
}
// A conta, linha a linha: as mesmas parcelas arredondadas que dão o total
// (o motor devolve-as em `parts` e elas somam o total ao cêntimo). A energia
// e a TAR só aparecem separadas quando se sabe a separação — nos fixos em que
// o CEME não a publica fica a linha conjunta, sem inventar a parte de cada uma.
function costTable(q) {
  const p = q.parts;
  if (!p) return '';
  const row = (label, v, cls = '') => `<tr class="${cls}"><td>${label}</td><td>${eur(v)}</td></tr>`;
  return `<table class="cost"><tr><th colspan="2">${i18n('costTitle', { k: kwhTxt() })}</th></tr>
    ${row(i18n('costEnergyTar', { p: perName(q.period) }), p.energyTar)}
    ${p.energy != null ? row('&nbsp;&nbsp;' + i18n('rowEnergy'), p.energy, 'sub') + row('&nbsp;&nbsp;' + i18n('rowTar'), p.tar, 'sub') : ''}
    ${row(i18n('costIec'), p.iec)}
    ${row(i18n('activation'), p.activation)}
    ${p.support ? row(i18n('costSupport'), p.support) : ''}
    ${row(i18n('costBase'), p.base)}
    ${Number.isFinite(q.vat) ? row(i18n('costVat', { rate: Math.round((q.vat - 1) * 100) + '%' }), p.vatEur) : ''}
    ${row('<b>' + i18n('costTotal') + '</b>', q.totalEur)}</table>`;
}
function detail(q) {
  // A tabela de preços por período. O período que foi USADO no cálculo
  // (o do total acima) vem assinalado — sem isso, dois preços e nenhuma
  // pista de qual deles entrou na conta.
  const aplicado = q.period;
  const rows = Object.entries(q.prices || {}).map(([p, v]) => {
    const s = q.split && q.split[p];
    const linha = `<tr class="${p === aplicado ? 'aplicado' : ''}"><td>${p === aplicado ? '<b>' + perName(p) + '</b> <span class="tag-aplicado">' + i18n('periodUsed') + '</span>' : perName(p)}</td><td>${kwhe(v)}</td><td>${eur(v * effKwh())}</td></tr>`;
    // A decomposição energia + TAR, só quando a temos (o CEME publicava a

    const sub = s ? `<tr class="sub"><td>&nbsp;&nbsp;${i18n('rowEnergy')}</td><td>${kwhe(s.energy)}</td><td>${eur(s.energy * effKwh())}</td></tr>`

// Rampa de calor do preço: verde nos baratos, vermelho nos caros.
// A escala é logarítmica entre o mais barato e o mais caro de toda a lista:
// com uma escala linear quase tudo ficava verde, porque os mais caros estão
// muito acima da mediana.
const HEAT = [
  [0.00, [21, 128, 61]],    // verde
  [0.28, [77, 124, 15]],    // verde-oliva
  [0.48, [202, 138, 4]],    // âmbar
  [0.68, [234, 88, 12]],    // laranja
  [0.86, [220, 38, 38]],    // vermelho
  [1.00, [153, 27, 27]],    // vermelho escuro
];
function heatColor(f) {
  f = Math.max(0, Math.min(1, f));
  for (let i = 1; i < HEAT.length; i++) {
    if (f <= HEAT[i][0]) {
      const [p0, c0] = HEAT[i - 1], [p1, c1] = HEAT[i];
      const k = (f - p0) / (p1 - p0 || 1);
      return 'rgb(' + c0.map((v, j) => Math.round(v + (c1[j] - v) * k)).join(',') + ')';
    }
  }
  return 'rgb(' + HEAT[HEAT.length - 1][1].join(',') + ')';
}
// 0 no tarifário mais barato da lista, 1 no mais caro (escala log).
function heatOf(preco, lo, hi) {
  if (!(hi > lo) || !(preco > 0)) return 0;
  return Math.log(preco / lo) / Math.log(hi / lo);
}

function card(q, i, max, lo, hi) {

// O tarifário serve a tensão (BT/MT) escolhida no "ramal"?
function supportsRamal(q) { return q.voltage === S.ramal || q.voltage === 'BT/MT' || String(q.voltage).includes(S.ramal); }
// Cada tarifário existe no seed em duas variantes, BT e MT (só a TAR muda).
// Aqui fica uma entrada por (CEME, nome), escolhendo a variante da tensão
// seleccionada (S.ramal). O ranking, os favoritos e o comparador usam todos
// esta função, para mostrarem a mesma lista.
const tariffKey = (tf) => tf.ceme + '|' + tf.name;
function dedupByRamal(rows) {
  const byKey = new Map();
  for (const tf of rows) {
    if (!supportsRamal(tf)) continue;
    const k = tariffKey(tf);
    const cur = byKey.get(k);
    // preferência: tensão exacta ao ramal seleccionado
    if (!cur || (tf.voltage === S.ramal && cur.voltage !== S.ramal)) byKey.set(k, tf);
  }
  return [...byKey.values()];
}

// Ordenação alfabética estável. Usa a collation portuguesa de propósito: os
// nomes são os que o CEME publica, e ordenar pela língua da interface faria
// a lista mudar de ordem ao trocar a bandeira.
const byAlpha = (a, b) => a.ceme.localeCompare(b.ceme, 'pt') || a.name.localeCompare(b.name, 'pt');

  return [...list].sort(byAlpha).map(q => `<option value="${esc(q.id)}" ${q.id === sel ? 'selected' : ''}>${esc(q.ceme)} — ${tariffName(q.name)}</option>`).join('');

  const pick = (list, wanted, fallback) => list.find(q => tariffKey(q) === wanted) || list.find(q => q.id === fallback) || list[0];
  const a0 = pick(idx, S.idxKey, S.idx), b0 = pick(fix, S.fixKey, S.fix);

  S.fixKey = tariffKey(b0); S.fix = b0.id;

function svgChart(days, a, b) {
  const W = 680, H = 230, P = 36;
  const all = days.flatMap(d => [d.vaz, d.fora, b.vaz, b.fora]).filter(Number.isFinite);
  const lo = Math.min(...all), hi = Math.max(...all), span = (hi - lo) || 1;
  const X = i => P + i * (W - 2 * P) / Math.max(days.length - 1, 1);
  const Y = v => H - P - (v - lo) / span * (H - 2 * P);
  const line = (f, c, dash) => `<polyline fill="none" style="stroke:${c}" stroke-width="2.2" ${dash ? `stroke-dasharray="${dash}"` : ''} points="${days.map((d, i) => `${X(i).toFixed(1)},${Y(f(d)).toFixed(1)}`).join(' ')}"/>`;
  const wins = days.map((d, i) => d.fora < b.fora ? i : -1).filter(i => i >= 0);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">
    <defs><linearGradient id="g" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#1d4ed8" stop-opacity=".35"/><stop offset="1" stop-color="#1d4ed8" stop-opacity="0"/></linearGradient></defs>
    <text x="${P}" y="15" font-size="11" style="fill:var(--mut)">${days[0].date} → ${days[days.length - 1].date} · ${cycName(a.cycle)}${i18n('chartDays', { n: days.length })}</text>
    <text x="4" y="${Y(hi)}" font-size="10" style="fill:var(--mut)">${hi.toFixed(2)}</text>
    <text x="4" y="${Y(lo) + 10}" font-size="10" style="fill:var(--mut)">${lo.toFixed(2)}</text>
    ${[0.25, 0.5, 0.75].map(f => { const y = P + f * (H - 2 * P); return `<line x1="${P}" y1="${y}" x2="${W - 8}" y2="${y}" style="stroke:var(--grid)"/>`; }).join('')}
    ${line(d => d.fora, 'var(--cIdx)')}${line(d => d.vaz, 'var(--cIdxOff)')}
    ${line(() => b.fora, 'var(--cFix)', '7 4')}${line(() => b.vaz, 'var(--cFixOff)', '7 4')}
    ${wins.map(i => `<circle cx="${X(i).toFixed(1)}" cy="${Y(days[i].fora).toFixed(1)}" r="3" style="fill:var(--cIdx)"/>`).join('')}
  </svg><div class="legend"><span style="color:var(--cIdx)">━ ${i18n('legendIdxPeak')}</span> · <span style="color:var(--cIdxOff)">━ ${i18n('legendIdxOff')}</span> · <span style="color:var(--cFix)">┄ ${i18n('legendFixed')}</span> · <span style="color:var(--cIdx)">●</span> ${i18n('legendWins')}</div>`;
}
// Colapsa quartos em faixas contíguas: 10:30, 10:45, 11:00 -> "10:30–11:15".
// A contiguidade e a ordem vêm do INSTANTE (`utc`), não da hora de relógio:
// no dia da mudança de hora de Outubro há dois quartos "01:00" (ordenar os
// rótulos misturava-os), e na de Março o relógio salta das 00:45 para as
// 02:00 sem que haja buraco nenhum.
function ranges(quarters) {
  const qs = [...quarters].sort((a, b) => (a.utc < b.utc ? -1 : 1));
  const out = [];
  let first = null, last = null;
  for (const q of qs) {
    if (first && Date.parse(q.utc) - Date.parse(last.utc) === 15 * 60000) { last = q; continue; }
    if (first) out.push(first.start + '–' + last.end);
    first = q; last = q;
  }
  if (first) out.push(first.start + '–' + last.end);
  return out;
}

async function loadQuarters(a, date) {
  const box = document.getElementById('cmpQ');
  if (!a) return;
  try {
    // As horas mostram-se no relógio da região do carregamento, que é onde se
    // lêem os períodos (vazio/fora).
    const q = await api(`/v1/indexed/quarters?tariff=${a.id}&region=${S.region}&tz=${encodeURIComponent(regionTz())}${S.fix ? '&fixed=' + S.fix : ''}${date ? '&date=' + date : ''}`);
    const byPrice = [...q.quarters].sort((x, y) => x.price - y.price);
    const wins = ranges(byPrice.slice(0, 8));

    // "Onde o indexado ganha ao fixo" é diferente de "os 8 mais baratos": o
    // primeiro precisa do fixo escolhido, que vai em &fixed=.
    const temFixo = !!q.fixed;
    const faixasIdx = temFixo ? ranges(q.quarters.filter(x => x.winner === 'IDX')) : [];
    const resumo = !temFixo ? i18n('vsFixedNoData')
      : q.wins.idx ? i18n('vsFixed', { w: q.wins.idx, n: q.wins.total }) + (faixasIdx.length ? ' — ' + faixasIdx.join(' · ') : '')
      : i18n('vsFixedNone');

    const show = (window._qOrder === 'price' ? byPrice : q.quarters);
    box.innerHTML = `<div class=card><div style="display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:6px">
      <div><b style="font-size:16px">${q.date}</b> · ${a.ceme} — ${tariffName(a.name)} <small>(K=${fmtNum(q.k)}, CGS=${fmtNum(q.cgs)})</small>${q.estimated ? ` <span class="badge bnd">${i18n('omipEst')}</span>` : q.estimatedFrom ? ` <span class="badge bnd">${i18n('omipFrom', { t: q.estimatedFrom })}</span>` : ''}</div>
      <small style="color:var(--mut)">${q.source}</small></div>
      <div class="row" style="margin:8px 0">
        <div style="flex:1;display:flex;gap:4px;flex-wrap:wrap">${(q.days || []).map(d => `<button data-d="${d}" class="${d === q.date ? 'on' : ''}" style="padding:5px 9px;font-size:12px">${d.slice(5)}</button>`).join('')}</div>
        <div style="display:flex;gap:4px"><button id="qTime" style="padding:5px 9px;font-size:12px" class="${window._qOrder !== 'price' ? 'on' : ''}">${i18n('byTime')}</button><button id="qPrice" style="padding:5px 9px;font-size:12px" class="${window._qOrder === 'price' ? 'on' : ''}">${i18n('cheapestQ')}</button></div>
      </div>
      <small style="display:block;margin-top:6px">${i18n('eightCheap')} <b>${wins.join(' · ') || '—'}</b></small>
      <small style="display:block;margin-top:4px;color:${temFixo ? 'var(--ink)' : 'var(--mut)'}">${resumo}</small>
      <div class="qwrap" style="margin-top:8px"><table class="q"><tr><th>${i18n('thTime')}</th><th>${i18n(temFixo ? 'thPerIdx' : 'period')}</th>${temFixo ? `<th>${i18n('thPerFix')}</th>` : ''}<th>${i18n('thOmie')}</th><th>${i18n('thIdx')}</th>${temFixo ? `<th>${i18n('thFix')}</th><th>${i18n('thWin')}</th>` : ''}</tr>
      ${show.map(x => `<tr class="${x.winner === 'IDX' ? 'win-idx' : x.winner === 'FIX' ? 'win-fix' : ''}${x.cheap ? ' cheap' : ''}"><td>${x.start}–${x.end}${x.cheap ? ' ★' : ''}</td><td>${perName(x.period)}</td>${temFixo ? `<td>${perName(x.fixPeriod || x.period)}</td>` : ''}<td>${x.omieMwh.toFixed(1)}</td><td class="p-idx">${x.price.toFixed(4)}</td>${temFixo ? `<td class="p-fix">${x.fixed == null ? '—' : x.fixed.toFixed(4)}</td><td class="w">${x.winner === 'IDX' ? i18n('winIdx') : x.winner === 'FIX' ? i18n('winFix') : x.winner === 'EQ' ? i18n('winEq') : '—'}</td>` : ''}</tr>`).join('')}
      </table></div>
      ${temFixo ? `<small style="display:block;margin-top:6px">${i18n('qCompareNote')}</small>` : ''}</div>`;
    document.getElementById('qTime').onclick = () => { window._qOrder = 'time'; loadQuarters(a, q.date); };
    document.getElementById('qPrice').onclick = () => { window._qOrder = 'price'; loadQuarters(a, q.date); };
    box.querySelectorAll('[data-d]').forEach(x => x.onclick = () => loadQuarters(a, x.dataset.d));
  } catch (e) {
    box.innerHTML = `<div class=card>${i18n('qUnavailable')}</div>`;
  }
}
async function loadCmp() {
  const a = LAST.find(q => q.id === S.idx), b = LAST.find(q => q.id === S.fix);
  if (!a || !b) return;
  const d = a.totalEur - b.totalEur;
  document.getElementById('cmpKpi').innerHTML =
    `<div><small>${a.ceme} · ${i18n('kIdx')}</small><br><b>${eur(a.totalEur)}</b> <small>· ${kwhe(a.eurKwhNoIva)}</small></div>
     <div><small>${b.ceme} · ${i18n('kFix')}</small><br><b>${eur(b.totalEur)}</b> <small>· ${kwhe(b.eurKwhNoIva)}</small></div>
     <div><small>${i18n('diffNow')}</small><br><b style="color:${d > 0 ? 'var(--cWarn)' : 'var(--cFix)'}">${d > 0 ? '+' + eur(d) : eur(d)}</b> <small>${d > 0 ? i18n('fixedWins') : i18n('idxWins')}</small></div>`;
  try {
    const [daily] = await Promise.all([api('/v1/omie/daily?days=60')]);
    const cyc = a.cycle === 'DIARIO' ? ['bd_v', 'bd_f'] : ['bs_v', 'bs_f'];
    const loss = 1 + (a.loss || 0);
    // A mesma fórmula de engine/indexed.js, repetida aqui para o gráfico de
    // 60 dias não precisar de um endpoint próprio. O test/formula.test.js
    // extrai esta linha e confirma que dá o mesmo que o backend: se mudares
    // uma, muda a outra.
    const yn = a.formula === 'ynerluz';
    const idxPrice = (o, t) => yn ? loss * (o + a.k) + a.cgs + t : loss * (o + a.k + a.cgs) + t;
    const tar = await api('/v1/tar').then(j => Object.fromEntries(j.data.filter(tr => tr.region === 'CONT' && tr.voltage === a.voltage).map(tr => [tr.period, tr.price_eur_kwh])));
    const days = daily.rows.filter(r => r[cyc[0]] != null).map(r => ({
      date: r.date.slice(5),
      vaz: idxPrice(r[cyc[0]] / 1000, tar.VAZIO || 0),
      fora: idxPrice(r[cyc[1]] / 1000, tar.FORA_VAZIO || 0),
    }));
    const fixedFora = b.prices.FORA_VAZIO ?? b.prices.UNICO;
    const wins = days.filter(x => x.fora < fixedFora).length;
    // breakeven: a mesma fórmula ao contrário (espelha breakevenOmie no backend)
    const be = yn ? ((fixedFora - a.cgs - (tar.FORA_VAZIO || 0)) / loss) - a.k
      : ((fixedFora - (tar.FORA_VAZIO || 0)) / loss) - a.k - a.cgs;
    document.getElementById('cmpChart').innerHTML = svgChart(days, a, { vaz: b.prices.VAZIO ?? b.prices.UNICO, fora: fixedFora }) +
      `<div class=card><small>${i18n('winsTxt', { w: wins, d: days.length, be: be.toFixed(3), src: daily.source, cache: daily.cached ? i18n('cache') : '' })}</small></div>`;
  } catch (e) {
    document.getElementById('cmpChart').innerHTML = `<div class=card>${i18n('histUnavail')}</div>`;
  }
  loadQuarters(a);
}

/* ================= boot ================= */
async function refresh() {
  const kwh = effKwh();
  if (S.energyMode === 'kwh') S.kwh = kwh;
  let at = null;
  if (S.chargeAt) at = S.chargeAt;
  else if (!S.forceServerTime) at = new Date().toISOString();
  const body = { kwh, region: S.region, omie: S.omie, omieVazio: S.omieVazio, omieFora: S.omieFora };
  // OMIE escolhido à mão (o slider do comparador) vale para todos os ciclos;
  // o automático vai por ciclo.
  if (S.omieAuto !== false && S.omieCycles) body.omieCycles = S.omieCycles;
  if (at) body.at = at;
  // OMIE automático: o indexado cota-se ao OMIE do quarto de hora do carregamento.
  if (S.omieAuto !== false) body.useSpot = true;
  const j = await api('/v1/simulate', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });
  LAST = j.data || []; AVG = j.avg; AT = j.at; OMIE = j.omieRef;
  if (!S.chargeAt && !S.forceServerTime && j.at) {
    const skew = Math.abs(new Date(j.at).getTime() - Date.now());
    if (skew > 5 * 60 * 1000) { S.forceServerTime = true; S.chargeAt = null; }
  }
  S.serverNow = j.at;
}
async function route() {
  const cmp = location.hash.startsWith('#/comparar');
  document.getElementById('nHome').classList.toggle('on', !cmp);
  document.getElementById('nCmp').classList.toggle('on', cmp);
  document.getElementById('app').innerHTML = cmp ? vCmp() : vHome();
  if (!cmp) {
    const R2 = () => refresh().catch(e => console.warn('[ceme] refresh falhou:', e.message)).then(route);
    // Mudar kWh <-> bateria muda a energia, logo obriga a recalcular. O botão
    // marca-se logo, e o resto redesenha-se quando chega a resposta.
    document.querySelectorAll('[data-em]').forEach(x => x.onclick = () => {
      S.energyMode = x.dataset.em;
      document.querySelectorAll('[data-em]').forEach(b => b.classList.toggle('on', b === x));
      R2();
    });
    const kwhEl = document.getElementById('kwh');
    if (kwhEl) kwhEl.onchange = e => { S.kwh = Number(e.target.value || 40); R2(); };
    const batCapEl = document.getElementById('batCap');
    if (batCapEl) batCapEl.onchange = e => { S.batCap = Number(e.target.value || 60); R2(); };
    const batMinEl = document.getElementById('batMin');
    // Durante o arrasto do slider só se mexem os números que dependem dele.
    // Redesenhar tudo substituía o próprio slider a meio do gesto. O
    // redesenho completo fica para o `change`, quando o utilizador larga.
    const liveKwh = () => {
      const big = document.querySelector('.bigkwh');
      if (big) big.innerHTML = `${kwhTxt()} <span style="font-size:18px;color:var(--mut)">kWh</span>`;
      const note = document.getElementById('batNote');
      if (note) note.textContent = i18n('chargingFrom', { a: S.batMin, b: S.batMax, c: kwhTxt() });
    };
    if (batMinEl) batMinEl.oninput = e => { S.batMin = Number(e.target.value); liveKwh(); };
    const batMaxEl = document.getElementById('batMax');
    if (batMaxEl) batMaxEl.oninput = e => { S.batMax = Number(e.target.value); liveKwh(); };
    if (batMinEl) batMinEl.onchange = () => R2();
    if (batMaxEl) batMaxEl.onchange = () => R2();
    document.querySelectorAll('[data-r]').forEach(x => x.onclick = () => { S.region = x.dataset.r; R2(); });
    const q = document.getElementById('q');
    if (q) q.oninput = e => { S.q = e.target.value; const pos = e.target.selectionStart; route(); const q2 = document.getElementById('q'); if (q2) { q2.focus(); q2.setSelectionRange(pos, pos); } };
    document.querySelectorAll('[data-ramal]').forEach(x => x.onclick = () => { S.ramal = x.dataset.ramal; route(); });
    const fG = document.getElementById('fGreen'); if (fG) fG.onclick = () => { S.green = !S.green; route(); };
    const fP = document.getElementById('fPop'); if (fP) fP.onclick = () => { S.popular = !S.popular; fP.classList.toggle('on', S.popular); route(); };
    const fB = document.getElementById('fBundle'); if (fB) fB.onclick = () => { S.nobundle = !S.nobundle; route(); };
    const fF = document.getElementById('fFav'); if (fF) fF.onclick = () => { S.favonly = !S.favonly; route(); };
    const ofm = document.getElementById('openFavModal');
    if (ofm) ofm.onclick = () => { document.getElementById('favModal').classList.add('on'); renderFavModal(); };
    const cfm = document.getElementById('closeFavModal');
    if (cfm) cfm.onclick = () => { document.getElementById('favModal').classList.remove('on'); route(); };
    const fsm = document.getElementById('favSearch');
    if (fsm) fsm.oninput = e => { FM.q = e.target.value; renderFavModal(); };
    const fmPop = document.getElementById('fmPop'); if (fmPop) fmPop.onclick = () => { FM.pop = !FM.pop; fmPop.classList.toggle('on', FM.pop); renderFavModal(); };
    const fmBun = document.getElementById('fmBundle'); if (fmBun) fmBun.onclick = () => { FM.bundle = !FM.bundle; fmBun.classList.toggle('on', FM.bundle); renderFavModal(); };
    const fmGrn = document.getElementById('fmGreen'); if (fmGrn) fmGrn.onclick = () => { FM.green = !FM.green; fmGrn.classList.toggle('on', FM.green); renderFavModal(); };
    const whenEl = document.getElementById('when');
    // Uma data ilegível fica marcada como erro e não recalcula (em vez de
    // voltar em silêncio a "agora").
    if (whenEl) whenEl.onchange = e => {
      const at = fromIsoDisplay(e.target.value);
      if (!at) { e.target.setCustomValidity(i18n('whenBad')); e.target.reportValidity(); return; }
      e.target.setCustomValidity('');
      S.chargeAt = at; R2();
    };
    if (whenEl) whenEl.oninput = e => e.target.setCustomValidity('');
    const nowBtn = document.getElementById('nowBtn');
    if (nowBtn) nowBtn.onclick = () => { S.chargeAt = null; R2(); };
  } else {
    // Com a lista ainda a carregar, vCmp() não desenha os dropdowns, por
    // isso os elementos abaixo podem não existir.
    const cmpIdx = document.getElementById('cmpIdx'), cmpFix = document.getElementById('cmpFix'), cmpOmie = document.getElementById('cmpOmie');
    if (cmpIdx) cmpIdx.onchange = e => { S.idx = e.target.value; loadCmp(); };
    if (cmpFix) cmpFix.onchange = e => { S.fix = e.target.value; loadCmp(); };
    if (cmpOmie) {
      cmpOmie.oninput = e => { document.getElementById('cmpOmieV').textContent = Number(e.target.value).toFixed(3); };
      cmpOmie.onchange = e => { S.omie = Number(e.target.value); S.omieVazio = S.omie; S.omieFora = S.omie; S.omieAuto = false; refresh().catch(e => console.warn('[ceme] refresh falhou:', e.message)).then(loadCmp); };
    }
    if (cmpIdx) loadCmp();
  }
  saveS();
}
// Vai buscar o OMIE de referência em segundo plano: com a BD vazia pode
// demorar dezenas de segundos, e a página não fica à espera.
async function loadOmieRef() {
  try {
    // O último dia COMPLETO: o de amanhã, depois das ~13:00, ainda não tem a
    // última hora (é do dia de mercado seguinte de Madrid) — ver `complete`.
    const d = await api('/v1/omie/daily?days=7');
    const rows = d.rows || [];
    const r = rows.filter(x => x.complete !== false).slice(-1)[0] || rows.slice(-1)[0];
    if (!r) return;
    const vals = [r.bd_v, r.bd_f, r.bs_v, r.bs_f].filter(v => Number.isFinite(v));
    if (vals.length) S.omie = Math.round((vals.reduce((a, b) => a + b, 0) / vals.length) / 1000 * 1000) / 1000;
    // Médias vazio/fora (€/kWh) POR CICLO: cada indexado usa as do seu ciclo
    // (o vazio semanal não é o diário). omieVazio/omieFora ficam para o
    // comparador e para quem lê o estado.
    const toKwh = v => Number.isFinite(v) ? v / 1000 : null;
    S.omieCycles = {
      DIARIO: { vazio: toKwh(r.bd_v) ?? S.omie, fora: toKwh(r.bd_f) ?? S.omie },
      SEMANAL: { vazio: toKwh(r.bs_v) ?? S.omie, fora: toKwh(r.bs_f) ?? S.omie },
    };
    S.omieVazio = S.omieCycles.DIARIO.vazio;
    S.omieFora = S.omieCycles.DIARIO.fora;
    if (S.omieAuto) { await refresh(); route(); }
  } catch (e) { /* mantém o valor por omissão */ }
}

async function init() {
  try {
    loadS();
    setLang(initialLang(), false);
    document.querySelectorAll('[data-lang]').forEach(b => b.onclick = () => { setLang(b.dataset.lang); route(); });
    const tb = document.getElementById('themeBtn'); if (tb) tb.onclick = toggleTheme;
    await refresh();   // rápido: só o simulate, com o OMIE por omissão
  } catch (e) {
    // Se o primeiro pedido falhar, mostra o erro com um botão para tentar
    // outra vez (em vez de uma página em branco).
    setLang(initialLang(), false);
    const app = document.getElementById('app');
    if (app) app.innerHTML = `<div class="card"><b>${i18n('bootFail')}</b><p>${i18n('bootFailWhy')}</p><button onclick="location.reload()">${i18n('retry')}</button></div>`;
    return;
  }
  route();           // pinta já
  loadOmieRef();     // e depois acerta o OMIE e repinta
}
window.addEventListener('hashchange', route);
init();</script>
