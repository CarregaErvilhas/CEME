  <span class="langs" role="group" aria-label="Idioma / Language">
    <button data-lang="pt" title="Português" aria-label="Português"><svg viewBox="0 0 35 20" preserveAspectRatio="xMidYMid meet" aria-hidden="true"><rect width="14" height="20" fill="#046A38"/><rect x="14" width="21" height="20" fill="#DA291C"/><circle cx="14" cy="10" r="4.8" fill="#FFCC00" stroke="#fff" stroke-width=".7"/><circle cx="14" cy="10" r="2.2" fill="#DA291C"/></svg></button>
    <button data-lang="en" title="English" aria-label="English"><svg viewBox="0 0 60 30" preserveAspectRatio="xMidYMid meet" aria-hidden="true"><defs><clipPath id="uJack"><path d="M0,0 H60 V30 H0 Z"/></clipPath></defs><g clip-path="url(#uJack)"><rect width="60" height="30" fill="#012169"/><path d="M0,0 L60,30 M60,0 L0,30" stroke="#FFFFFF" stroke-width="6"/><path d="M30,0 V30 M0,15 H60" stroke="#FFFFFF" stroke-width="10"/></g><path d="M0,0 L60,30 M60,0 L0,30" stroke="#C8102E" stroke-width="4"/><path d="M30,0 V30 M0,15 H60" stroke="#C8102E" stroke-width="6"/></svg></button>

<div class="hero grupo-hero"><div class="in" id="hero"></div></div>

<footer id="foot"></footer>
<script>window.__LANG__=null;</script>
<script src="/strings.js"></script>
<script src="/grupo.js"></script>
<script src="/pwa.js"></script>
<script>
'use strict';
/* Página "O grupo": os outros sites do grupo d'O Carro Elétrico, cada um num
 * balão ao lado da sua mascote, com a descrição e as ligações para o site e
 * para o GitHub. O próprio comparador aparece no seu lugar, com "Estás aqui".
 *
 * A voz da página vive em strings.js (namespace "grupo"). Os sites, a ordem,
 * os textos de cada um e as ligações vêm do kit da marca (brand/group.json,
 * que scripts/brand.mjs passa a /grupo.js), tal como as mascotes
 * (/grupo/<id>.svg). */
const STR = CEME_STR('grupo');
let LANG = (function () {
  try { const s = localStorage.getItem('ceme:lang'); if (s === 'pt' || s === 'en') return s; } catch (e) {}
  return (typeof window.__LANG__ === 'string' && window.__LANG__ === 'en') ? 'en' : 'pt';
})();
const t = (k) => STR[LANG][k] ?? STR.pt[k] ?? k;
const set = (id, html) => { const el = document.getElementById(id); if (el) el.innerHTML = html; };
const attr = (s) => String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');

// Os textos do group.json são texto simples: vão para o HTML com escape.
const KIT = window.CEME_GRUPO;
const label = (k) => KIT.labels[k][LANG];
// w/h: o tamanho do viewBox de cada SVG, para a imagem não saltar ao carregar.
const SITES = () => KIT.sites.map(s => ({
  id: s.id, host: s.host, here: s.id === 'ceme', site: s.url, repo: s.repo, private: s.private,
  src: '/' + s.mascot.file, w: s.mascot.width, h: s.mascot.height, alt: s.mascot.alt[LANG],
  name: attr(s.name[LANG]), desc: attr(s.desc[LANG]), note: s.note ? attr(s.note[LANG]) : '',
}));
const ICON = {
  code: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 7 3 12l5 5M16 7l5 5-5 5M14 4l-4 16"/></svg>',
  lock: '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10.5" width="14" height="10" rx="2.5"/><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5"/></svg>',
};

function chrome() {
  document.documentElement.lang = LANG === 'en' ? 'en' : 'pt-PT';
  document.title = t('docTitle');
  set('logoTxt', t('logoA') + ' <b class="lg2">' + t('logoB') + '</b>');
  set('nSim', t('navSim'));
  set('nAssistant', t('navAssistant'));
  set('nSobre', t('navSobre'));
  set('nContactos', t('navContactos'));
  document.querySelectorAll('[data-lang]').forEach(b => b.classList.toggle('on', b.dataset.lang === LANG));
  if (window.CEME_THEME) CEME_THEME.paint();
}

function mate(g) {
  const go = g.here ? `<span class="here">${label('here')}</span>`
    : g.site ? `<a class="go" href="${g.site}" target="_blank" rel="noopener">${label('open')} →</a>` : '';
  const code = `<a class="gh" href="${g.repo}" target="_blank" rel="noopener">${g.private ? ICON.lock + label('private') : ICON.code + label('code')}</a>`;
  return `
      <li class="mate m-${g.id}">
        <div class="mate-pic"><img src="${g.src}" alt="${attr(g.alt)}" width="${g.w}" height="${g.h}" loading="lazy"></div>
        <div class="mate-bubble">
          <p class="mate-host">${g.host}</p>
          <h2>${g.name}</h2>
          <p>${g.desc}</p>${g.note ? `<p class="mate-note">${g.note}</p>` : ''}
          <p class="mate-links">${go}${code}</p>
        </div>
      </li>`;
}

function render() {
  chrome();
  const sites = SITES();
  const me = sites.find(g => g.here);
  set('hero', `
    <div class="grupo-text">
      <span class="eyebrow">${t('eyebrow')}</span>
      <h1>${t('h1')}</h1>
      <p>${t('lede')}</p>
    </div>
    <div class="stage">
      <img class="mascot" src="${me.src}" alt="${attr(me.alt)}" width="${me.w}" height="${me.h}">
      <p class="bubble">${t('bubble')}</p>
    </div>`);
  set('app', `<ol class="mates">${sites.map(mate).join('')}
    </ol>`);
  set('foot', `${t('footNote')} <a href="/simulador">${t('navSim')}</a><span class="sep">·</span><a href="/sobre">${t('navSobre')}</a><span class="sep">·</span><a href="/contactos">${t('navContactos')}</a><span class="sep">·</span><a href="/privacidade">${t('navPriv')}</a>`);
}

document.querySelectorAll('[data-lang]').forEach(b => b.onclick = () => {
  LANG = b.dataset.lang === 'en' ? 'en' : 'pt';
  try { localStorage.setItem('ceme:lang', LANG); } catch (e) {}
  render();
});
render();
</script>
</body>
</html>
