<style>
:root {
  --bg0: #F7F7F7; --bg1: #EDEDED;
  --card: #FBFBFB;
  --ink: #1E1E1E;
  --mute: #6F6F6F;
  --line: #D8D8D8;
  --line2: #B9B9B9;
  --soft: #E9E9E9;
  --land: #DADADA;
  --charge: #3C9A5F;
  --have: #C4C4C4;
  --r: 6px;
  --gap: 16px;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg0: #1C1C1C; --bg1: #121212;
  --card: #202020;
  --ink: #E9E9E9;
  --mute: #9B9B9B;
  --line: #333333;
  --line2: #4A4A4A;
  --soft: #2A2A2A;
  --land: #3C3C3C;
  --have: #4E4E4E;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg1) linear-gradient(180deg, var(--bg0), var(--bg1)) fixed;
  color: var(--ink);
  font: 400 15px/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
  min-height: 100dvh;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 1.5px solid var(--ink); outline-offset: 3px; }
.num { font-variant-numeric: tabular-nums; }

/* ---------- moldura ---------- */
.shell { max-width: 460px; margin: 0 auto; min-height: 100dvh; display: flex; flex-direction: column; padding: 0 var(--gap); }
.top { display: flex; align-items: center; gap: 10px; height: 56px; flex: none; }
.brand { font-weight: 500; letter-spacing: .04em; text-decoration: none; color: inherit; font-size: 14px; }
.home { display: flex; align-items: center; gap: 8px; font-weight: 500; letter-spacing: .04em; text-decoration: none; color: inherit; font-size: 14px; }
.home img { width: 28px; height: 28px; border-radius: 8px; display: block; }
.top .spacer { flex: 1; }
.iconbtn { width: 36px; height: 36px; border: 0; background: none; border-radius: var(--r); display: grid; place-items: center; color: var(--ink); }
.iconbtn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.top .back { margin-left: -10px; }
.lang { display: flex; gap: 2px; }
.lang button { border: 0; background: none; padding: 6px 7px; border-radius: var(--r); font-size: 13px; color: var(--mute); }
.lang button[aria-pressed="true"] { color: var(--ink); }
.progress { display: flex; gap: 5px; flex: 1; max-width: 120px; }
.progress i { flex: 1; height: 2px; border-radius: 1px; background: var(--line); }
.progress i.on { background: var(--ink); }
main { flex: 1; display: flex; flex-direction: column; }
.screen { flex: 1; display: flex; flex-direction: column; animation: enter .28s ease-out; }
@keyframes enter { from { opacity: 0; transform: translateX(10px); } }
h1 { font-size: 24px; line-height: 1.25; font-weight: 500; letter-spacing: -.01em; margin: 22px 0 6px; }
.lede { color: var(--mute); margin: 0 0 26px; max-width: 36ch; }

/* botões: calmos, sem blocos pretos */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; height: 44px; padding: 0 18px; border-radius: var(--r); border: 1px solid var(--line2); background: var(--card); font-weight: 500; font-size: 14px; }
.btn.wide { width: 100%; }
.btn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.foot { position: sticky; bottom: 0; display: flex; align-items: center; justify-content: flex-end; gap: 14px; padding: 12px 0 calc(16px + env(safe-area-inset-bottom)); margin-top: auto; background: linear-gradient(to bottom, transparent, var(--bg1) 30%); }
.foot .lbl { font-size: 13px; color: var(--mute); }
.next { width: 48px; height: 48px; border-radius: 50%; border: 1px solid var(--ink); background: var(--card); display: grid; place-items: center; transition: background .15s; }
.next svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.next:active { background: var(--soft); }

/* ---------- landing ---------- */
.landing { text-align: center; justify-content: center; align-items: center; padding-bottom: 32px; }
.landing h1 { font-size: clamp(26px, 7vw, 32px); margin: 36px 0 10px; max-width: 18ch; text-wrap: balance; font-weight: 500; }
.landing .lede { margin: 0 auto 30px; max-width: 32ch; }
.landing .small { margin-top: 36px; font-size: 12px; color: var(--mute); line-height: 1.7; }
.landing .small a { color: inherit; }
.scene { width: min(340px, 86vw); overflow: visible; }
.scene .s { fill: none; stroke: var(--ink); stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
.scene .thin { stroke-width: 1; stroke: var(--line2); }
.scene .wheel { fill: var(--bg0); }
/* A cena anima-se por JS com atributos SVG (ver playScene); opacity,
   dashoffset e transform não podem estar aqui, o CSS sobrepor-se-ia. */
.scene .dot, .scene .bolt { fill: var(--charge); stroke: none; }

/* ---------- bateria ---------- */
.readout { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin: 4px 0 18px; }
.readout .pct { display: flex; align-items: baseline; font-size: 28px; font-weight: 500; letter-spacing: -.01em; }
.readout .pct .arr { color: var(--mute); font-weight: 400; margin: 0 8px; font-size: 22px; }
.readout .kwh { text-align: right; color: var(--mute); font-size: 13px; }
.readout .kwh .v { display: flex; align-items: baseline; justify-content: flex-end; color: var(--ink); font-size: 20px; font-weight: 500; }
/* valores editáveis: campo sem caixa, só um traço quando está em foco */
.ed { display: inline-flex; align-items: baseline; border-bottom: 1px solid transparent; }
.ed input { min-width: 1ch; border: 0; background: none; padding: 0; text-align: right; font: inherit; color: inherit; -moz-appearance: textfield; outline: none; }
.ed input::-webkit-inner-spin-button, .ed input::-webkit-outer-spin-button { -webkit-appearance: none; }
.ed:has(input:focus) { border-bottom-color: var(--ink); }
.readout .kwh .ed input { width: 2.6em; }
.batt { --from: 20; --to: 80; position: relative; display: flex; align-items: center; margin: 0 2px; }
.batt-body { position: relative; flex: 1; height: 40px; border: 1.25px solid var(--line2); border-radius: var(--r); padding: 3px; }
.batt-cells { position: relative; height: 100%; border-radius: 3px; overflow: hidden; background: var(--soft); }
.batt-have, .batt-add { position: absolute; top: 0; bottom: 0; }
.batt-have { left: 0; width: calc(var(--from) * 1%); background: var(--have); }
.batt-add { left: calc(var(--from) * 1%); width: calc((var(--to) - var(--from)) * 1%); background: var(--charge); }
.batt-nub { width: 4px; height: 16px; margin-left: 3px; border-radius: 0 2px 2px 0; background: var(--line2); }
/* Dois range sobrepostos; o trilho é o desenho, a pega é um traço fino com área de toque larga. */
.batt input[type=range] {
  position: absolute; top: 0; bottom: 0; left: -8px; width: calc(100% + 16px); height: 100%;
  margin: 0; background: none; pointer-events: none; -webkit-appearance: none; appearance: none;
}
.batt input[type=range]::-webkit-slider-runnable-track { background: none; height: 100%; }
.batt input[type=range]::-moz-range-track { background: none; }
.batt input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none; pointer-events: auto; width: 22px; height: 56px; margin-top: -9px; cursor: grab;
  background: linear-gradient(to right, transparent 10px, var(--ink) 10px, var(--ink) 12px, transparent 12px);
}
.batt input[type=range]::-moz-range-thumb {
  pointer-events: auto; width: 22px; height: 56px; border: 0; border-radius: 0; cursor: grab;
  background: linear-gradient(to right, transparent 10px, var(--ink) 10px, var(--ink) 12px, transparent 12px);
}
.batt input[type=range]:focus-visible { outline: none; }
.batt-scale { display: flex; justify-content: space-between; font-size: 11px; color: var(--mute); margin: 8px 9px 0 2px; }
.legend { display: flex; gap: 16px; font-size: 12px; color: var(--mute); margin-top: 14px; }
.legend i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; vertical-align: 0; }
.field-label { font-size: 13px; color: var(--mute); margin: 30px 0 10px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 4px; height: 36px; padding: 0 12px; border-radius: var(--r); border: 1px solid var(--line); background: var(--card); font-size: 14px; }
.chip[aria-pressed="true"] { border-color: var(--ink); background: var(--soft); }
/* 16px: abaixo disto o Safari do iOS faz zoom ao focar e não desfaz. */
.chip input { width: 46px; font-size: 16px; border: 0; background: none; outline: none; padding: 0; -moz-appearance: textfield; }
.chip input::-webkit-inner-spin-button { -webkit-appearance: none; }
.chip:has(input:focus-visible) { outline: 1.5px solid var(--ink); outline-offset: 2px; }
.hint { font-size: 12px; color: var(--mute); margin-top: 10px; }

/* ---------- mapa ---------- */
.maps { display: grid; grid-template-columns: 1.15fr 1fr; grid-template-rows: 1fr 1fr; gap: 10px; }
.tile { position: relative; border: 1px solid var(--line); border-radius: var(--r); background: var(--card); padding: 12px; text-align: left; display: flex; flex-direction: column; min-height: 150px; transition: border-color .15s, background .15s; }
.tile.cont { grid-row: span 2; min-height: 310px; }
.tile svg { flex: 1; width: 100%; min-height: 0; }
.tile .land { fill: var(--land); stroke: var(--line2); stroke-width: .75; stroke-linejoin: round; transition: fill .2s, stroke .2s; }
.tile .name { font-weight: 500; font-size: 14px; margin-top: 8px; }
.tile .sub { font-size: 12px; color: var(--mute); }
.tile[aria-pressed="true"] { border-color: var(--ink); background: var(--soft); }
.tile[aria-pressed="true"] .land { fill: var(--ink); stroke: var(--ink); }

/* ---------- quando ---------- */
.whens { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.when { border: 1px solid var(--line); border-radius: var(--r); background: var(--card); padding: 14px 14px 12px; text-align: left; min-height: 118px; display: flex; flex-direction: column; transition: border-color .15s, background .15s; }
.when svg { width: 52px; height: 32px; margin-bottom: auto; }
.when .stroke { stroke: var(--ink); fill: none; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
.when .fill { fill: var(--ink); }
.when .name { font-weight: 500; margin-top: 12px; font-size: 14px; }
.when .sub { font-size: 12px; color: var(--mute); }
.when[aria-pressed="true"] { border-color: var(--ink); background: var(--soft); }
.start { margin-top: 18px; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--r); background: var(--card); }
.start label { color: var(--mute); font-size: 13px; }
.start input { border: 0; background: none; font-size: 16px; font-weight: 500; text-align: right; padding: 0; outline: none; color: var(--ink); }
.start input:focus-visible { outline: 1.5px solid var(--ink); outline-offset: 4px; border-radius: 2px; }

/* ---------- resultados ---------- */
.summary { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 18px; }
.summary .chip { height: 32px; font-size: 13px; padding: 0 10px; }
.best { border: 1px solid var(--ink); border-radius: var(--r); padding: 18px; background: var(--card); }
.best .who { display: flex; align-items: center; gap: 12px; }
.best .price { font-size: 38px; font-weight: 500; letter-spacing: -.02em; margin: 16px 0 2px; line-height: 1.1; }
.best .per { color: var(--mute); font-size: 13px; }
.best .save { margin-top: 12px; font-size: 13px; }
.best .save b { color: var(--charge); font-weight: 600; }
.who .co { font-weight: 500; font-size: 14px; }
.who .tf { font-size: 12px; color: var(--mute); }
.tag { display: inline-block; font-size: 11px; color: var(--mute); border: 1px solid var(--line); border-radius: 3px; padding: 0 6px; margin: 6px 4px 0 0; }
.scope { font-size: 13px; font-weight: 600; color: var(--ink); margin: 14px 2px 0; }
.scope a { color: inherit; }
.best-h { font-size: 12px; font-weight: 500; color: var(--mute); margin: 0 0 14px; letter-spacing: .01em; }
.rank { flex: none; width: 28px; text-align: center; font-size: 15px; color: var(--mute); }
.rank.big { font-size: 22px; color: var(--ink); }
/* cor da marca do CEME (campo `brand` da API): um traço fino, a única cor da lista */
.brand { flex: none; align-self: stretch; width: 3px; min-height: 28px; border-radius: 2px; margin-right: 2px; }
.best .brand { min-height: 40px; }
.list-head { display: flex; align-items: center; justify-content: space-between; margin: 30px 0 8px; }
.list-head h2 { font-size: 15px; font-weight: 500; margin: 0; }
.filters { display: flex; gap: 8px; margin-bottom: 4px; flex-wrap: wrap; }
.filters .chip { height: 30px; font-size: 12px; padding: 0 10px; }
.rows { list-style: none; margin: 0; padding: 0; }
.row { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.row .who { flex: 1; min-width: 0; display: block; }
.row .co { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .tf { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.row .tag { margin-top: 4px; }
.row .p { text-align: right; font-weight: 500; font-size: 15px; }
.row .p small { display: block; font-weight: 400; font-size: 11px; color: var(--mute); }
.more { margin: 16px 0 0; }
.empty { color: var(--mute); padding: 24px 0; }
.loading { flex: 1; display: grid; place-items: center; color: var(--mute); font-size: 13px; }
.loading .bar { width: 140px; height: 2px; background: var(--line); border-radius: 1px; overflow: hidden; margin: 0 auto 12px; }
.loading .bar i { display: block; height: 100%; width: 40%; background: var(--ink); animation: slide 1s ease-in-out infinite; }
@keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
.full { text-align: center; font-size: 12px; margin: 24px 0 8px; }
.full a { color: var(--mute); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>

<body>
<div class="shell">
  <header class="top" id="top"></header>
  <main id="app"></main>
</div>
<script>window.__LANG__=null;</script>
<script src="/strings.js"></script>
<script src="/tz.js"></script>
<script src="/pwa.js"></script>
<script>
'use strict';
/* Assistente passo-a-passo: três perguntas (onde, quanto, quando) até ao
   tarifário mais barato. Usa a mesma API do simulador (`/v1/session` +
   `/v1/simulate`), por isso os preços são os mesmos. Os textos vivem em
   strings.js, partilhados com o simulador completo. */

const STR = CEME_STR('assistente');
const REGIONS = CEME_I18N.regions;
const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };
// Precedência: bandeira escolhida (localStorage) > Accept-Language injectado
// pelo servidor em __LANG__ > língua do browser. A mesma ordem do simulador.
let LANG = store.get('ceme:lang')
  || (typeof window.__LANG__ === 'string' ? window.__LANG__ : null)
  || ((navigator.language || '').toLowerCase().startsWith('en') ? 'en' : 'pt');
LANG = LANG === 'en' ? 'en' : 'pt';
// Tema: claro por omissão em cada visita; a escolha dura só a sessão.
let THEME = 'light';
try { if (sessionStorage.getItem('ceme:theme') === 'dark') THEME = 'dark'; } catch {}
const t = (k, v = {}) => (STR[LANG][k] ?? STR.pt[k] ?? k).replace(/\{(\w+)\}/g, (_, n) => v[n]);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const loc = () => (LANG === 'en' ? 'en-GB' : 'pt-PT');
const eur = n => new Intl.NumberFormat(loc(), { style: 'currency', currency: 'EUR' }).format(n);
const dec = (n, d = 1) => new Intl.NumberFormat(loc(), { minimumFractionDigits: d, maximumFractionDigits: d }).format(n);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

const TZ = CEME_TZ.TZ;
const DEF = { region: 'CONT', cap: 60, capOther: false, from: 20, to: 80, when: 'now', tTonight: '23:00', tTomorrow: '09:00', custom: '', nobundle: false, green: false, popular: false, all: false };
const P = { ...DEF };
// As respostas sobrevivem a um reload (os browsers móveis recarregam separadores
// em segundo plano); fecha-se o separador e recomeça-se do zero.
try { Object.assign(P, JSON.parse(sessionStorage.getItem('ceme:wizard') || '{}')); } catch {}
const saveP = () => { try { sessionStorage.setItem('ceme:wizard', JSON.stringify(P)); } catch {} };
const kwh = () => Math.round(P.cap * (P.to - P.from) / 10) / 10;

/* ---------- API ---------- */
let TK = null;
async function session() {
  const r = await fetch('/v1/session', { method: 'POST' });
  if (!r.ok) throw new Error('session ' + r.status);
  TK = (await r.json()).token;
}
async function api(path, opts = {}) {
  if (!TK) await session();
  const go = () => fetch(path, { ...opts, headers: { ...(opts.headers || {}), Authorization: 'Bearer ' + TK } });
  let r = await go();
  if (r.status === 401) { await session(); r = await go(); }
  if (!r.ok) throw new Error(path + ' ' + r.status);
  return r.json();
}
// OMIE de referência = último dia real, como no simulador. Arranca logo na
// landing para estar pronto quando se chega aos resultados.
const OMIE = (async () => {
  try {
    // O último dia COMPLETO (o de amanhã, à tarde, ainda não tem a última hora).
    const rows = (await api('/v1/omie/daily?days=7')).rows || [];
    const r = rows.filter(x => x.complete !== false).slice(-1)[0] || rows.slice(-1)[0];
    if (!r) return null;
    const vals = [r.bd_v, r.bd_f, r.bs_v, r.bs_f].filter(Number.isFinite);
    if (!vals.length) return null;
    const omie = Math.round(vals.reduce((a, b) => a + b, 0) / vals.length) / 1000;
    const k = v => (Number.isFinite(v) ? v / 1000 : null);
    // Por ciclo: cada indexado usa as médias do seu (diário ≠ semanal).
    const omieCycles = {
      DIARIO: { vazio: k(r.bd_v) ?? omie, fora: k(r.bd_f) ?? omie },
      SEMANAL: { vazio: k(r.bs_v) ?? omie, fora: k(r.bs_f) ?? omie },
    };
    return { omie, omieVazio: omieCycles.DIARIO.vazio, omieFora: omieCycles.DIARIO.fora, omieCycles };
  } catch { return null; }
})();

/* ---------- horas na região escolhida ---------- */
// zparts/zoned vivem em frontend/tz.js (partilhado com o simulador).
const { zparts, zoned } = CEME_TZ;
const hm = s => (/^\d{2}:\d{2}$/.test(s) ? s.split(':').map(Number) : [0, 0]);
function chargeAt() {
  const tz = TZ[P.region], now = new Date(), p = zparts(now, tz);
  if (P.when === 'tonight') { const [h, mi] = hm(P.tTonight); const d = zoned(p.y, p.m, p.d, h, mi, tz); return d > now ? d : zoned(p.y, p.m, p.d + 1, h, mi, tz); }
  if (P.when === 'tomorrow') { const [h, mi] = hm(P.tTomorrow); return zoned(p.y, p.m, p.d + 1, h, mi, tz); }
  if (P.when === 'custom' && P.custom) { const [a, b] = P.custom.split('T'); const [y, m, d] = a.split('-').map(Number); const [h, mi] = hm(b); return zoned(y, m, d, h, mi, tz); }
  return now;
}
const hhmm = d => new Intl.DateTimeFormat(loc(), { timeZone: TZ[P.region], hour: '2-digit', minute: '2-digit' }).format(d);
function whenLabel() {
  if (P.when === 'now') return t('now');
  if (P.when === 'tonight') return `${t('today')}, ${P.tTonight}`;
  if (P.when === 'tomorrow') return `${t('tmrw')}, ${P.tTomorrow}`;
  return new Intl.DateTimeFormat(loc(), { timeZone: TZ[P.region], day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }).format(chargeAt());

// Os Açores à escala real são pontos num mar de 600 km: cada ilha é ampliada
// (AZ) em torno do seu centro e as posições aproximadas ao centro do
// arquipélago (AZP), mantendo a disposição relativa dos três grupos.
const AZ = 1.6, AZP = .8, AZC = [-28.0, 38.3];
const centroid = p => p.reduce((a, q) => [a[0] + q[0] / p.length, a[1] + q[1] / p.length], [0, 0]);
const grow = (poly, k, at) => { const c = centroid(poly), o = at || c; return poly.map(([x, y]) => [o[0] + (x - c[0]) * k, o[1] + (y - c[1]) * k]); };
const azores = poly => { const c = centroid(poly); return grow(poly, AZ, [AZC[0] + (c[0] - AZC[0]) * AZP, AZC[1] + (c[1] - AZC[1]) * AZP]); };
const SHAPES = {
  CONT: GEO.CONT,
  MAD: GEO.MAD.map(p => grow(p, 1.3)),
  AZO: GEO.AZO.map(azores),
};
function mapSvg(key, w, h) {
  const polys = SHAPES[key];
  const pts = polys.flat(), lat0 = pts.reduce((a, p) => a + p[1], 0) / pts.length, k = Math.cos(lat0 * Math.PI / 180);
  const xs = pts.map(p => p[0] * k), ys = pts.map(p => -p[1]);
  const [x0, x1, y0, y1] = [Math.min(...xs), Math.max(...xs), Math.min(...ys), Math.max(...ys)];
  const pad = 14, s = Math.min((w - 2 * pad) / (x1 - x0), (h - 2 * pad) / (y1 - y0));
  const ox = (w - (x1 - x0) * s) / 2, oy = (h - (y1 - y0) * s) / 2;
  const pr = ([lon, lat]) => [ox + (lon * k - x0) * s, oy + (-lat - y0) * s];
  const d = polys.map(p => 'M' + p.map(q => pr(q).map(v => v.toFixed(1)).join(',')).join('L') + 'Z').join('');
  return `<svg viewBox="0 0 ${w} ${h}" aria-hidden="true"><path class="land" d="${d}"/></svg>`;
}

  return `<section class="screen">
    <h1>${t('whenH')}</h1><p class="lede">${t('whenL')}</p>
    <div class="whens">${opt('now', hhmm(new Date()))}${opt('tonight', `${t('from_')} ${P.tTonight}`)}${opt('tomorrow', `${t('from_')} ${P.tTomorrow}`)}${opt('custom', t('pickSub'))}</div>
    ${field ? `<div class="start">${field}</div>` : ''}
    ${nextBtn('resultados', t('see'))}
  </section>`;
}

let LAST = null, AVG = null, LOADING = false, FAILED = false;
async function load() {
  LOADING = true; FAILED = false; render();
  try {
    const ref = await Promise.race([OMIE, new Promise(r => setTimeout(() => r(null), 4000))]);
    // useSpot: cada indexado cotado ao OMIE do quarto de hora do início da
    // carga, como o ranking em automático. As médias de `ref` ficam de plano
    // B para quando esse quarto ainda não foi publicado.
    const body = { kwh: kwh(), region: P.region, at: chargeAt().toISOString(), useSpot: true, ...(ref || {}) };
    const j = await api('/v1/simulate', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });
    // Um tarifário por (CEME, nome), na variante BT — como o simulador por omissão.
    const seen = new Map();
    for (const r of j.data || []) {
      if (!(r.voltage === 'BT' || String(r.voltage).includes('BT'))) continue;
      const key = r.ceme + '|' + r.name, cur = seen.get(key);
      if (!cur || (r.voltage === 'BT' && cur.voltage !== 'BT')) seen.set(key, r);
    }
    LAST = [...seen.values()].sort((a, b) => a.totalEur - b.totalEur);
    AVG = j.avg;
  } catch (e) { console.warn('[assistente]', e.message); FAILED = true; }
  LOADING = false; render();
}
function vResults() {
  const summary = `<div class="summary">
    <button class="chip num" data-go="quanto">${dec(kwh())} kWh</button>
    <button class="chip" data-go="onde">${REGIONS[P.region][LANG].curto}</button>
    <button class="chip" data-go="quando">${esc(whenLabel())}</button></div>`;
  const foot = `<div class="foot"><button class="btn wide" data-act="restart">${t('restart')}</button></div>`;
  if (LOADING || !LAST && !FAILED) return `<section class="screen">${summary}<div class="loading"><div><div class="bar"><i></i></div>${t('calc')}</div></div>${foot}</section>`;
  if (FAILED) return `<section class="screen">${summary}<p class="empty">${t('err')}</p><button class="btn wide" data-act="retry">${t('retry')}</button>${foot}</section>`;
  const items = LAST.filter(r => (!P.nobundle || !r.bundle) && (!P.green || r.green) && (!P.popular || r.popular));
  const tags = r => `${r.popular ? `<span class="tag">${t('tagPopular')}</span>` : ''}${r.bundle ? `<span class="tag">${t('tagBundle')}</span>` : ''}${r.green ? `<span class="tag">${t('tagGreen')}</span>` : ''}`;
  const price = r => `${r.estimated ? '~' : ''}${eur(r.totalEur)}`;
  const brand = r => (/^#[0-9a-f]{6}$/i.test(r.brand || '') ? `<i class="brand" style="background:${r.brand}" aria-hidden="true"></i>` : '');
  const best = items[0], rest = items.slice(1), shown = P.all ? rest : rest.slice(0, 8);
  const bestHtml = best ? `<article class="best">
      <h1 class="best-h">${t('cheapest')}</h1>
      <div class="who"><span class="rank big num">1</span>${brand(best)}<div><div class="co">${esc(best.ceme)}</div><div class="tf">${esc(best.name)}</div></div></div>
      <div class="price num">${price(best)}</div>
      <div class="per num">${t('perKwh', { p: eur(best.totalEur / kwh()) })}${best.estimated ? ` · ${t('est')}` : ''}</div>
      ${AVG > best.totalEur ? `<div class="save num">${t('below', { v: eur(AVG - best.totalEur) })}</div>` : ''}
      <div>${tags(best)}</div>
    </article>
    <p class="scope">${t('scope')} <a href="https://www.mobie.pt/custo-do-carregamento" target="_blank" rel="noopener">${t('scopeLink')}</a></p>` : '';
  return `<section class="screen">${summary}
    ${bestHtml}
    <div class="list-head"><h2>${t('others')}</h2></div>
    <div class="filters">
      <button class="chip" data-filter="popular" aria-pressed="${P.popular}">${t('fPopular')}</button>
      <button class="chip" data-filter="nobundle" aria-pressed="${P.nobundle}">${t('fNoBundle')}</button>
      <button class="chip" data-filter="green" aria-pressed="${P.green}">${t('fGreen')}</button></div>
    ${items.length ? `<ul class="rows">${shown.map((r, i) => `<li class="row"><span class="rank num">${i + 2}</span>${brand(r)}
        <div class="who"><div class="co">${esc(r.ceme)}</div><div class="tf">${esc(r.name)}</div>${tags(r)}</div>
        <div class="p num">${price(r)}<small>${eur(r.totalEur / kwh())}/kWh</small></div></li>`).join('')}</ul>
      ${!P.all && rest.length > shown.length ? `<button class="btn wide more" data-act="all">${t('showAll', { n: items.length })}</button>` : ''}`
      : `<p class="empty">${t('none')}</p>`}
    <p class="full"><a href="/simulador">${t('fullSim')}</a> · <a href="/sobre">${t('navSobre')}</a> · <a href="/contactos">${t('navContactos')}</a> · <a href="/privacidade">${t('navPriv')}</a></p>
    ${foot}
  </section>`;
}

/* ---------- router ---------- */
const stepOf = () => (location.hash.replace(/^#\/?/, '') || 'landing');
function render() {
  const step = stepOf();
  saveP();
  document.documentElement.lang = LANG === 'en' ? 'en' : 'pt-PT';
  document.documentElement.dataset.theme = THEME;
  document.title = t('docTitle');
  header(step);
  const app = document.getElementById('app');
  app.innerHTML = { onde: vWhere, quanto: vHow, quando: vWhen, resultados: vResults }[step]?.() ?? vLanding();
  if (step === 'quanto') bindBattery();
  if (step === 'landing') playScene();
}
// Cena da landing animada por requestAnimationFrame, com atributos SVG: nem
// CSS nem SMIL animam de forma fiável em todos os browsers móveis. Sequência:
// o carro chega (0–2.4 s), o cabo liga (2.5–3.4 s), a luz acende (3.4–3.9 s).
// Toca sempre, mesmo com «reduzir movimento» activo no sistema: é a única
// animação da página, curta, uma vez só, e é a apresentação do produto.
function playScene() {
  const svg = document.querySelector('.scene');
  if (!svg) return;
  const car = svg.querySelector('.car'), cable = svg.querySelector('.cable'), lights = svg.querySelectorAll('.dot, .bolt');
  const paint = (x, dash, on) => {
    car.setAttribute('transform', `translate(${x.toFixed(1)} 0)`);
    cable.setAttribute('stroke-dashoffset', dash.toFixed(1));
    lights.forEach(e => e.setAttribute('opacity', on.toFixed(2)));
  };
  const ease = x => 1 - Math.pow(1 - clamp(x, 0, 1), 3), t0 = performance.now();
  const frame = now => {
    const t = (now - t0) / 1000;
    paint(-300 * (1 - ease(t / 2.4)), 110 * (1 - ease((t - 2.5) / 0.9)), clamp((t - 3.4) / 0.5, 0, 1));
    if (t < 4 && svg.isConnected) requestAnimationFrame(frame);
  };
  requestAnimationFrame(frame);
}
function bindBattery() {
  const b = document.getElementById('batt'), f = document.getElementById('rFrom'), to = document.getElementById('rTo');
  const iF = document.getElementById('iFrom'), iT = document.getElementById('iTo'), iK = document.getElementById('iKwh');
  const paint = () => {
    f.value = P.from; to.value = P.to;
    b.style.setProperty('--from', P.from); b.style.setProperty('--to', P.to);
    if (document.activeElement !== iF) iF.value = P.from;
    if (document.activeElement !== iT) iT.value = P.to;
    if (document.activeElement !== iK) iK.value = kwh();
    // largura ao conteúdo: sem isto «20% → 80%» fica com buracos entre os números
    for (const i of [iF, iT, iK]) i.style.width = `calc(${String(i.value).length}ch + 2px)`;
    // a pega de cima é a que está mais perto do toque: com as duas encostadas
    // no fundo, só a do «até» se conseguiria arrastar.
    f.style.zIndex = P.from > 50 ? 2 : 1;
  };
  const set = (from, to_, keep) => {
    from = clamp(Math.round(from), 0, 99); to_ = clamp(Math.round(to_), 1, 100);
    if (to_ - from < 1) { if (keep === 'from') to_ = from + 1; else from = to_ - 1; }
    P.from = from; P.to = to_; paint();
  };
  f.oninput = () => set(+f.value, P.to, 'from');
  to.oninput = () => set(P.from, +to.value, 'to');
  iF.oninput = () => { if (iF.value !== '') set(+iF.value, P.to, 'from'); };
  iT.oninput = () => { if (iT.value !== '') set(P.from, +iT.value, 'to'); };
  iK.oninput = () => { const v = +iK.value; if (v > 0) set(P.from, P.from + v / P.cap * 100, 'from'); };
  iK.onblur = iF.onblur = iT.onblur = paint;
  paint();
  const other = document.getElementById('capOther');
  other.oninput = () => {
    const v = +other.value;
    if (v >= 5 && v <= 250) { P.cap = v; P.capOther = true; }
    document.querySelectorAll('[data-cap]').forEach(x => x.setAttribute('aria-pressed', 'false'));
    other.closest('.chip').setAttribute('aria-pressed', 'true');
    paint();
  };
}

document.addEventListener('click', e => {
  const el = e.target.closest('button, [data-go]');
  if (!el) return;
  const d = el.dataset;
  if (d.lang) { LANG = d.lang; store.set('ceme:lang', LANG); return render(); }
  if (d.act === 'theme') { THEME = THEME === 'dark' ? 'light' : 'dark'; try { sessionStorage.setItem('ceme:theme', THEME); } catch {} return render(); }
  if (d.go) { if (d.go === 'resultados') LAST = null; location.hash = '#/' + d.go; return; }
  if (d.region) { P.region = d.region; document.querySelectorAll('[data-region]').forEach(x => x.setAttribute('aria-pressed', x === el)); return; }
  if (d.cap) { P.cap = +d.cap; P.capOther = false; return render(); }
  if (d.when) { P.when = d.when; return render(); }
  if (d.filter) { P[d.filter] = !P[d.filter]; return render(); }
  if (d.act === 'back') { const i = STEPS.indexOf(stepOf()); location.hash = i > 0 ? '#/' + STEPS[i - 1] : stepOf() === 'resultados' ? '#/quando' : '#/'; return; }
  if (d.act === 'all') { P.all = true; return render(); }
  if (d.act === 'retry') return load();
  if (d.act === 'restart') { Object.assign(P, DEF); LAST = null; location.hash = '#/onde'; }
});
document.addEventListener('input', e => {
  if (e.target.id === 'startT' && /^\d{2}:\d{2}$/.test(e.target.value)) { P[P.when === 'tonight' ? 'tTonight' : 'tTomorrow'] = e.target.value; saveP(); }
  if (e.target.id === 'startD') { P.custom = e.target.value; saveP(); }
});
window.addEventListener('hashchange', () => {
  window.scrollTo(0, 0);
  if (stepOf() === 'resultados') { P.all = false; return load(); }
  render();
});
if (stepOf() === 'resultados') load(); else render();
</script>
</body>
</html>
