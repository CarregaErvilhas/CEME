# CEME v2 no Zerops — configuração do serviço runtime da API.
#
# É um `zerops.yml` (runtime apenas): os serviços managed — PostgreSQL 18 e
# Valkey 7.2 — criam-se à parte (ver `zerops-import.yaml`), com os hostnames
# `db` e `cache`, e é deles que este serviço puxa as variáveis por referência
# `${hostname_variavel}`.
#
# JWT_SECRET: env secret do serviço `api` (gerado no import; editável na GUI).
# Nunca no repositório.
#
# Deploy: `zcli push api --setup api` na raiz do repo.
zerops:
  - setup: api
    build:
      base: nodejs@24
      # Os buildCommands correm em /build/source (= raiz do repo). `cd` num
      # buildCommand funciona (é um shell), mas encadear num `-` mantém o
      # resto do build no mesmo shell.
      buildCommands:
        - cd backend && npm ci
      # Sem `cache:`. A cache do build só ajuda `npm install`, que é
      # incremental; com `npm ci` o node_modules é apagado e reinstalado do
      # zero de qualquer maneira (docs do npm e o FAQ do Zerops), portanto o
      # restore era trabalho perdido: mover para /build/source, apagar,
      # reinstalar. A cache HTTP do npm (~/.npm) vive fora de /build/source e
      # é preservada na mesma, sem config; é ela que faz os ~3s do npm ci.
      deployFiles:
        - backend
        - frontend
    # Deploy sem downtime (rolling). `temporaryShutdown: false` é o default,
    # mas fica explícito porque é a diferença entre "o pod novo entra em
    # serviço antes do velho sair" e "o velho sai primeiro" — o segundo
    # caso é uma janela de 502 em cada deploy.
    deploy:
      temporaryShutdown: false
      # Readiness check: o pod novo só recebe tráfego depois de responder.
      # Se não responder a tempo, o deploy é abortado e a versão anterior
      # continua a servir — um deploy mau não é uma queda do site.
      # `/readyz` (e não `/`) porque diz se a BD está a responder, não
      # só se o processo está vivo.
      readinessCheck:
        httpGet:
          port: 3001
          # TEMPORÁRIO (teste do guard de deploy): caminho inexistente, para
          # o readiness check reprovar à vontade e ver o deploy ser abortado
          # com a versão anterior a servir. Revertido no PR seguinte.
          path: /readyz-inexistente
        # A app faz schema + seed no arranque: pode levar uns segundos.
        # 120 s dá folga sem passar o limite de 5 min da plataforma.
        failureTimeout: "120s"
        retryPeriod: "10s"
    run:
      base: nodejs@24
      # `run.start` é executado por `exec`, não por um shell — `cd backend &&`
      # falhava com "exec: cd: not found" (exit 127) e o serviço entrava em
      # crash loop. O directório certo vai em `workingDir` (default /var/www).
      startCommands:
        - command: npm start
          name: api
          workingDir: /var/www/backend
      ports:
        - port: 3001
          httpSupport: true
      # Health check (liveness): corre sempre, no pod vivo. É `/healthz` —
      # só confirma que o processo responde. NÃO usar `/v1/health` (está
      # atrás de auth e responde 401 sem token, o que marcaria o serviço
      # como unhealthy para sempre) nem `/readyz` (que pergunta à BD: com
      # um só pod, desligá-lo do balancer por causa de uma blip da BD
      # tirava o site inteiro, em vez de só a API).
      healthCheck:
        httpGet:
          port: 3001
          path: /healthz
        # Falhas seguidas até reiniciar o container.
        failureTimeout: "60s"
        # Tempo de falhas até o container sair do balancer.
        disconnectTimeout: "30s"
        # Tempo saudável até o container voltar ao balancer.
        recoveryTimeout: "30s"
        execPeriod: "10s"
      envVariables:
        PORT: 3001
        NODE_ENV: production
        # Referência às variáveis de sistema do serviço managed `db` — o pg
        # gera connectionString, hostname, user, password e port
        # automaticamente (ref: docs.zerops.io/features/env-variables).
        DATABASE_URL: ${db_connectionString}
