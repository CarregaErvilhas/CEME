name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Cancela runs obsoletos do mesmo PR/branch: aqui só há testes, portanto
# cancelar a run anterior quando chega um push novo é sempre seguro.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Actions fixadas por SHA (a tag pode ser movida; o SHA não). O
      # Dependabot actualiza as duas coisas.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # 24 = o que o zerops.yml suporta (nodejs@24); testar noutra versão
          # daria um verde que a produção não reproduz.
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Run tests
        working-directory: backend
        run: npm test

# O deploy NÃO é feito aqui. Quem o faz é o webhook do próprio Zerops
# (serviço api → Build, Deploy, Run Pipeline Settings → Connect with a GitHub
# repository, trigger "Push to branch: main"), que puxa o código quando o
# push chega a main. Assim não existe nenhuma credencial Zerops no GitHub
# para vazar.
#
# O que impede código sem testes de chegar a produção é a protecção do main (exige este
# job `test` verde antes do merge) — ver infra.md secção 4.
