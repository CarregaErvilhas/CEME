name: CLA

# Verifica que cada autor de pull request assinou o CLA.md, com o CLA Assistant
# Lite. Assinar é comentar no pull request a frase exacta do CLA.md ("How to
# sign"); a action guarda-a em signatures/v1/cla.json no branch
# cla-signatures, que o ruleset do main não cobre. Os passos vivem no
# OCarroEletrico, para o grupo ter uma só cópia (ver docs/shared-ci.md lá);
# aqui ficam os gatilhos, as permissões e os textos.
#
# pull_request_target corre com permissões de escrita mesmo para pull
# requests de forks, portanto nem este workflow nem o partilhado podem fazer
# checkout ou correr o código do pull request.
#
# Quando os termos do CLA.md mudarem, passa o caminho para
# signatures/v2/cla.json: toda a gente tem de assinar a versão nova no
# próximo pull request.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, reopened, closed]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    uses: CarregaErvilhas/OCarroEletrico/.github/workflows/cla.yml@74ff022edf1f7bbaea86123d0ae6d8b3ef13cc54 # main
    with:
      document-url: https://github.com/CarregaErvilhas/CEME/blob/main/CLA.md
      sign-comment: I have read CLA.md and I agree to it, for my past and future contributions to CEME.
      notsigned-comment: >-
        Obrigado por contribuíres para o CEME. Antes de isto poder entrar,
        lê o [Contributor License Agreement](https://github.com/CarregaErvilhas/CEME/blob/main/CLA.md)
        e assina-o comentando neste pull request exactamente a frase abaixo.
        Só assinas uma vez.
      allsigned-comment: Todos os autores assinaram o CLA. Obrigado!
      allowlist: FernandoMiguel,*[bot]
      signatures-path: signatures/v1/cla.json
      branch: cla-signatures
