version: 2
updates:
  - package-ecosystem: "npm"        # dependências do backend (package.json)
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    cooldown:
      default-days: 14              # espera 14 dias entre atualizações da mesma dependência
    open-pull-requests-limit: 1     # apenas 1 PR aberto por vez (evita spam)
    labels:
      - "dependencies"
      - "backend"
    commit-message:
      prefix: "deps(backend)"
      include: "scope"
    groups:
      patch-and-minor:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"  # actions usadas nos workflows (.github/workflows)
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    cooldown:
      default-days: 14
    open-pull-requests-limit: 1
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "deps(actions)"
      include: "scope"
    groups:
      patch-and-minor:
        update-types:
          - "minor"
          - "patch"
